<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クイズRPGバトル</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/icons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#17110c;--panel:#2b2018;--panel2:#3a2c20;--line:#8a6a35;--tx:#f1e4c3;--mut:#b9a57f;--acc:#e0b650;--red:#a8262f;--grn:#5e8a45;--blu:#5aa7ff;--pur:#6b3f7a}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.55;min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#3b2a1b 0,#17110c 65%) fixed,repeating-linear-gradient(90deg,#0000 0 38px,#ffffff05 38px 40px) fixed;background-color:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-family:"Cinzel","Shippori Mincho",serif;letter-spacing:.06em;color:var(--acc);font-weight:700}
.hide{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.btn{background:linear-gradient(180deg,#4a382a,#2f241a);border:1px solid var(--line);border-radius:3px;padding:8px 16px;box-shadow:inset 0 0 0 2px #0004;letter-spacing:.05em}
.btn:hover:not(:disabled){border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#f0d37a,#b8872f);color:#2a1a08;border-color:#f0d37a;font-weight:700;text-shadow:0 1px 0 #fff6}
.btn.ok{background:linear-gradient(180deg,#78a85c,#476f33);color:#fff;border-color:#a8d08c;font-weight:700;font-size:1.1rem;padding:12px 28px}
.btn.ng{background:linear-gradient(180deg,#c04048,#7d1a22);color:#fff;border-color:#e08a90;font-weight:700;font-size:1.1rem;padding:12px 28px}
.box,header.top,#ctl,#log,#modal .mbox{background:linear-gradient(180deg,#32261c,#261c14);border:1px solid var(--line);border-radius:4px;box-shadow:inset 0 0 0 4px #1a120c,inset 0 0 0 5px #8a6a3566,0 6px 18px #0008}
.box{padding:18px;margin:14px 0}
#setup h1{font-size:2.2rem;margin:10px 0 4px;text-align:center;text-shadow:0 2px 0 #000a}
#setup>.sub{text-align:center}
.sub{color:var(--mut);font-size:.9rem}
.prow{display:flex;gap:8px;margin-bottom:8px}
.prow input,.prow select{background:#1b140e;border:1px solid var(--line);color:var(--tx);border-radius:3px;padding:8px;font:inherit}
.prow input{flex:1;min-width:0}
.bosses{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bossopt{background:#1f1710;border:1px solid var(--line);border-radius:3px;padding:12px;text-align:left;box-shadow:inset 0 0 0 3px #0005}
.bossopt.sel{border-color:var(--acc);background:#3a2a17;box-shadow:inset 0 0 0 3px #0005,0 0 14px #e0b65055}
.bossopt small{display:block;color:var(--mut)}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 18px}
.qno{font-size:1.5rem;font-weight:800;font-family:"Cinzel","Shippori Mincho",serif;color:var(--acc)}
.genre{background:linear-gradient(180deg,#8b5aa0,#5a2f6a);color:#fff;border:1px solid #c9a0dc;border-radius:3px;padding:2px 14px;font-weight:700}
.layout{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.row-label{color:var(--acc);font-family:"Cinzel","Shippori Mincho",serif;letter-spacing:.15em;margin:8px 0;display:flex;align-items:center;gap:10px}
.row-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),#0000)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#3d2e21,#2a1f16);border:1px solid var(--line);border-radius:4px 4px 18px 18px;padding:10px;text-align:left;position:relative;transition:.15s;box-shadow:inset 0 0 0 3px #1a120c,inset 0 0 0 4px #8a6a3555}
.card.foe{background:linear-gradient(180deg,#4a1d22,#2b1013);border-color:#a8505a}
.card.can:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:inset 0 0 0 3px #1a120c,0 4px 14px #e0b65066}
.card.sel{border-color:#fff3c0;box-shadow:inset 0 0 0 3px #1a120c,0 0 0 2px var(--acc),0 0 18px #e0b650aa}
.card.dead{filter:grayscale(1) brightness(.7);opacity:.55}
.card.rest{opacity:.7}
.card .em{font-size:1.6rem;width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--acc);border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:radial-gradient(circle,#4a3822,#1d140c)}
.card .nm{font-weight:700}
.card .jb{color:var(--mut);font-size:.8rem}
.hpbar{height:10px;background:#0009;border:1px solid #000;border-radius:2px;overflow:hidden;margin:6px 0 2px}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#8fc06f,#4a7a34);transition:width .4s}
.foe .hpbar i{background:linear-gradient(180deg,#d6525c,#8c1c24)}
.hpt{font-size:.85rem;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:#0006;border:1px solid var(--line);border-radius:2px;font-size:.7rem;padding:0 6px}
.chip.warn{border-color:var(--acc);color:var(--acc)}
.hit{animation:hit .5s}.heal{animation:heal .6s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-6px);filter:brightness(1.6) sepia(1) hue-rotate(-30deg)}60%{transform:translateX(6px)}}
@keyframes heal{50%{box-shadow:inset 0 0 0 3px #1a120c,0 0 0 4px #7fc06088}}
#ctl{margin-top:14px;padding:16px;text-align:center;min-height:90px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
#log{padding:12px;max-height:70vh;overflow:auto;font-size:.85rem}
#log p{margin:0 0 6px;padding-bottom:6px;border-bottom:1px dotted #8a6a3577}
#log p.sys{color:var(--acc)}#log p.dmg{color:#ee8f96}#log p.heal{color:#a4d98c}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
#modal .mbox{padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;border-color:var(--acc)}
#modal h3{margin-bottom:10px}
#modal .opts{display:grid;gap:8px}
.opt{background:linear-gradient(180deg,#4a382a,#2f241a);border:1px solid var(--line);border-radius:3px;padding:10px 14px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--acc);background:linear-gradient(180deg,#5a4430,#3a2b1d)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt small{display:block;color:var(--mut)}
.opt.foe{border-color:#a8505a}.opt.ghost{background:transparent}
.cancel{margin-top:12px;width:100%;background:transparent;border:1px solid var(--line);border-radius:3px;padding:6px;color:var(--mut)}
#over{position:fixed;inset:0;background:radial-gradient(circle,#000a,#000e);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9;text-align:center}
#over.on{display:flex}
#over h2{font-size:3.2rem;text-shadow:0 0 24px currentColor}
table.rules{border-collapse:collapse;width:100%;font-size:.85rem}
table.rules td,table.rules th{border-bottom:1px dotted var(--line);padding:4px 6px;text-align:left;vertical-align:top}

/* ===== layout overrides: 中世風の舞台構成 ===== */
:root{--ink:#3a2a14;--rubric:#7a1f26;--vel:#e8d9b0}
.wrap{max-width:1240px}
/* header: ぶら下がる旗ではなく、罫線で区切る見出し */
header.top{background:none;border:0;border-bottom:3px double var(--line);border-radius:0;box-shadow:none;padding:4px 2px 12px}
.crest{color:var(--acc);font-size:1.7rem;margin-right:8px}
.layout{grid-template-columns:1fr 290px;gap:26px;align-items:start}
.row-label{display:none}
/* 舞台：魔王は中央の大旗、プレイヤーは盾を並べる */
#foes{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:10px 0 30px;border-bottom:1px solid #8a6a3544;margin-bottom:10px;background:radial-gradient(ellipse at 50% 100%,#8a6a3533,#0000 70%)}
#pls{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;padding:6px 0 80px}
#pls .card:nth-child(even){margin-top:26px}
.card{--shape:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);width:166px;min-height:196px;padding:14px 16px 52px;border:0;border-radius:0;box-shadow:none;clip-path:var(--shape);background:linear-gradient(180deg,#f0d37a,#8a6a35);color:var(--tx)}
.card::before{content:"";position:absolute;inset:3px;background:linear-gradient(180deg,#43331f,#241a12);clip-path:var(--shape);z-index:0}
.card>*{position:relative;z-index:1}
.card.foe{--shape:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);width:min(320px,100%);min-height:0;padding:16px 22px 46px;background:linear-gradient(180deg,#e7a0a0,#7d2c34)}
.card.foe::before{background:linear-gradient(180deg,#5a1f26,#2b1013)}
.card.can:hover{transform:translateY(-4px);box-shadow:none;filter:drop-shadow(0 6px 8px #000)}
.card.sel{background:linear-gradient(180deg,#fffbe0,#e0b650);box-shadow:none;filter:drop-shadow(0 0 10px #e0b650)}
.card.foe .em{width:64px;height:64px;font-size:2.4rem}
.card.foe .nm{font-size:1.25rem;font-family:"Cinzel","Shippori Mincho",serif;letter-spacing:.08em}
.card .em{border-radius:50%}
.card .jb,.card .hpt{position:relative}
.chips{justify-content:flex-start}
/* 審判席：下に固定された木の台 */
#ctl{position:sticky;bottom:8px;z-index:5;margin-top:0;flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left;gap:10px 22px;padding:14px 22px;border:2px solid #120c07;border-radius:0;
  background:repeating-linear-gradient(90deg,#0000 0 120px,#0003 120px 122px),repeating-linear-gradient(180deg,#5d4329 0 7px,#4f3921 7px 14px);
  box-shadow:inset 0 2px 0 #b58a4a,inset 0 -3px 0 #2a1c0e,0 -6px 18px #000a}
#ctl .btn{border-radius:0}
/* 年代記：羊皮紙の巻物 */
#log{color:var(--ink);border:0;border-radius:2px;padding:42px 18px 18px;position:relative;max-height:78vh;
  background:linear-gradient(90deg,#cdb988,#e8d9b0 14%,#e8d9b0 86%,#cdb988);box-shadow:inset 0 0 50px #8a6a3566,0 8px 22px #000b}
#log::before{content:"― 年 代 記 ―";position:absolute;top:12px;left:0;right:0;text-align:center;font-family:"Cinzel","Shippori Mincho",serif;color:var(--rubric);font-weight:800;letter-spacing:.2em}
#log p{border-bottom:1px dotted #8a6a3577}
#log p.sys{color:var(--rubric);font-weight:700}#log p.dmg{color:#9a2630}#log p.heal{color:#3b6a2a}
@media(max-width:900px){#log{max-height:40vh}.card{width:150px}}
/* 設定画面：招集状 */
#setup{max-width:780px;margin:18px auto;padding:34px 40px 40px;color:var(--ink);border:1px solid #8a6a35;border-radius:2px;
  background:radial-gradient(ellipse at 20% 0,#f3e8c6,#e8d9b0 60%,#d6c18d);box-shadow:0 0 0 6px #2b2018,0 0 0 7px #8a6a35,0 14px 40px #000c}
#setup h1{color:var(--rubric);text-shadow:none}
#setup .sub,#setup .bossopt small{color:#6a5430}
#setup .box{background:none;border:0;border-top:1px solid #8a6a35;border-radius:0;box-shadow:none;padding:16px 0 6px;margin:16px 0 0}
#setup h3{color:var(--rubric)}
#setup .prow input,#setup .prow select{background:#f6ecce;color:var(--ink);border-color:#8a6a35}
#setup .bossopt{background:#f3e6c2;color:var(--ink);border-color:#8a6a35;box-shadow:none}
#setup .bossopt.sel{background:#e8c79a;border-color:var(--rubric);box-shadow:0 0 0 2px var(--rubric)}
#setup #onCode{color:var(--rubric)!important}
#setup #onUrl{color:var(--ink)!important}
#setup .chip{background:#f3e6c2;color:var(--ink);border-color:#8a6a35}
#setup .btn:not(.pri){background:#f3e6c2;color:var(--ink);border-color:#8a6a35;box-shadow:none}
#setup .btn.pri{border-radius:0}
#setup label{color:var(--ink)}
/* 盾の中身は中央揃えの縦並び */
#pls .card{width:178px;min-height:214px;text-align:center}
#pls .card>div:first-child{flex-direction:column;text-align:center;gap:2px!important}
#pls .card .em{width:44px;height:44px}
#pls .card .chips{justify-content:center}
#pls .card .hpt{justify-content:center;gap:10px}
.card.foe>div:first-child{align-items:center}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.t{background:#000d;border:1px solid var(--acc);padding:8px 18px;border-radius:20px;font-size:.9rem;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.float{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-weight:800;font-size:1.6rem;pointer-events:none;animation:fl 1.1s forwards;z-index:3;text-shadow:0 2px 3px #000}
.float.d{color:#ff7b86}.float.h{color:#8cf0a8}
@keyframes fl{to{transform:translate(-50%,-38px);opacity:0}}
kbd{font:inherit;font-size:.7em;opacity:.75;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:4px}
.opt b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= SETUP ================= -->
<div id="setup">
  <h1>⚜ QUIZ KNIGHTS ⚜</h1><div class="sub" style="font-size:1.1rem;letter-spacing:.3em">― クイズ騎士団 ―</div>
  <div class="sub">早押しクイズの進行に合わせて、誰が答えたか・正解/誤答を入力するとバトルを自動処理します。</div>

  <div class="box">
    <h3>モード</h3>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="bossopt" id="modeCpu" style="flex:1;min-width:200px"><b>🤖 CPU戦</b><small>全員で協力して魔王と戦う</small></button>
      <button class="bossopt" id="modePvp" style="flex:1;min-width:200px"><b>⚔ ユーザー対戦</b><small>2チームに分かれて戦う（全滅したら負け）</small></button>
    </div>
  </div>

  <div class="box" id="onlineBox">
    <h3>🌐 部屋の情報</h3>
    <div id="onOff" style="margin-top:10px"><span class="sub">サーバーに接続中…</span></div>
    <div id="onOn" class="hide" style="margin-top:10px">
      <div>部屋：<b id="onCode" style="font-size:1.6rem;letter-spacing:.2em;color:var(--acc)"></b></div>
      <div class="sub">参加者に伝えるURL（または一覧から入室）：<span id="onUrl" style="color:var(--tx);user-select:all"></span></div>
      <div id="onList" style="margin:8px 0"></div>
      <button class="btn" id="onImport">参加者を下のプレイヤー欄に取り込む</button>
    </div>
  </div>

  <div class="box">
    <h3>① プレイヤー（並び順 = 席順。両隣の判定に使います）</h3>
    <div id="plist" style="margin-top:10px"></div>
    <button class="btn" id="addP">＋ プレイヤー追加</button>
  </div>

  <div class="box" id="bossBox">
    <h3>② 魔王</h3>
    <div class="bosses" id="bosslist" style="margin-top:10px"></div>
  </div>

  <div class="box" id="penBox">
    <label><input type="checkbox" id="optPen" checked> 魔王も誤答時に2ダメージを受ける</label>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn pri" id="startBtn" style="font-size:1.1rem;padding:12px 32px">バトル開始</button>
    <button class="btn" id="contBtn">前回の続きから</button>
    <button class="btn" id="rulesBtn1">職業・ルール一覧</button>
    <button class="btn" id="closeRoom1">部屋を閉じる（一覧へ）</button>
  </div>
</div>

<!-- ================= GAME ================= -->
<div id="game" class="hide">
  <header class="top">
    <div><span class="crest">⚜</span><span class="qno" id="qno"></span> <span class="genre hide" id="genre"></span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="sub" id="roomInfo"></span><button class="btn" id="copyUrl">URLをコピー</button><button class="btn" id="sndBtn" aria-label="音">🔊</button>
      <button class="btn" id="undoBtn">↩ 1つ戻す</button>
      <button class="btn" id="rulesBtn2">職業・ルール</button>
      <button class="btn" id="closeRoom2">部屋を閉じる</button>
      <button class="btn" id="quitBtn">最初から</button>
    </div>
  </header>
  <div class="layout">
    <div>
      <div class="row-label"><span id="foeLabel">魔王軍</span></div>
      <div class="cards" id="foes"></div>
      <div class="row-label" style="margin-top:14px" id="plabel">プレイヤー</div>
      <div class="cards" id="pls"></div>
      <div id="ctl"></div>
    </div>
    <aside id="log"></aside>
  </div>
</div>
</div>

<div id="toast"></div>
<div id="modal"></div>
<div id="over"><h2 id="overT"></h2><div id="overS" class="sub"></div><button class="btn pri" id="overBtn">最初に戻る</button></div>

<script>
'use strict';
/* =====================================================================
   データ定義（数値の調整はここだけ触ればOK）
   ===================================================================== */
const JOB = {
  sage:     {n:'賢者',        e:'📿', atk:1, hp:5,  d:'通常攻撃の代わりに：死んだプレイヤー1人を体力1で蘇生'},
  monk:     {n:'僧侶',        e:'🙏', atk:1, hp:6,  d:'通常攻撃の代わりに：1人を3回復'},
  warrior:  {n:'戦士',        e:'🗡', atk:3, hp:7,  d:'通常攻撃の代わりに：自身と他1人に5ダメージ'},
  mage:     {n:'魔法使い',    e:'🔮', atk:3, hp:5,  d:'通常攻撃の代わりに：1人に1ダメージ＋そのプレイヤーは次の問題休み'},
  bm:       {n:'バトルマスター',e:'⚔', atk:5, hp:2,  d:'通常攻撃の代わりに：1人に8ダメージ（バトル中1度だけ）'},
  tank:     {n:'タンク',      e:'🛡', atk:1, hp:10, d:'仲間への攻撃を代わりに受けられる（権利は開始時1、正解で+1。死んでも継続）', tag:'🛡'},
  berserker:{n:'バーサーカー',e:'🪓', atk:7, hp:7,  d:'常にボタンにディレイがつく', tag:'⏱ディレイ'},
  mw:       {n:'魔法戦士',    e:'✨', atk:2, hp:5,  d:'通常攻撃が常に敵全体への攻撃になる'},
  thief:    {n:'盗賊',        e:'💰', atk:2, hp:4,  d:'正解したら次の問題のジャンルを選択（理系/文系/青問/緑問/赤問）'},
  playboy:  {n:'遊び人',      e:'🎲', atk:0, hp:3,  d:'連答（同じ人が連続正解）したら「勇者」に転職（体力リセット）'},
  hero:     {n:'勇者',        e:'👑', atk:7, hp:7,  d:'通常攻撃の代わりに：自身を3回復し、他1人に4ダメージ'},
  bomb:     {n:'ばくだんいわ',e:'💣', atk:1, hp:5,  d:'死んだら両隣に3ダメージ（同時に死んだ仲間も蘇生対象）', tag:'💥'},
  necro:    {n:'ネクロマンサー',e:'💀',atk:1, hp:5,  d:'通常攻撃の代わりに：1人に（死んでいる仲間の人数×1）ダメージ'}
};
const SELECTABLE = ['sage','monk','warrior','mage','bm','tank','berserker','mw','thief','playboy','bomb','necro']; // 勇者は転職専用
const GENRES = ['理系','文系','青問','緑問','赤問'];

const BOSS = {
  1:{n:'魔王1', e:'👹', forms:['通常'],
     hp:S=>S*1.5, d:'HP=攻撃合計×1.5 / 技1:敵1体に3 / 技2:指定1人に2＋両隣に1 / 残りHP半分以下で与ダメージ+2'},
  2:{n:'魔王2', e:'😈', forms:['第1形態','第2形態','第3形態'],
     hp:S=>S*0.5, d:'3形態（各HP=攻撃合計×0.5）。倒すと次の形態へ。第3形態は倒した敵を体力1で仲間に（死んでも魔王側）／スルーで1回復／敵撃破時に敵全体へ1ダメージ'},
  3:{n:'魔王3', e:'🐲', forms:['通常'],
     hp:S=>S*2, d:'HP=攻撃合計×2 / 技1:2人に1ダメージ後その分回復 / 技2:直前正解者に4 / 残りHP1で正解すると5回復'},
  4:{n:'魔王4', e:'👁', forms:['通常'],
     hp:S=>S*1, d:'HP=攻撃合計×1 / ボタン2種：通常ボタン正解=敵全体に1 / ディレイボタン正解=1人を倒す'}
};

/* =====================================================================
   状態
   ===================================================================== */
const $ = s=>document.querySelector(s);
const CANCEL = Symbol('cancel');
let G = null;            // ゲーム状態（JSONで保存・巻き戻し可能なプレーンデータのみ）
let undoStack = [];
let busy = false;
let lastHp = {};
let setup = {players:[
  {name:'プレイヤー1',job:'warrior',team:'p'},{name:'プレイヤー2',job:'monk',team:'p'},
  {name:'プレイヤー3',job:'mage',team:'e'},{name:'プレイヤー4',job:'tank',team:'e'}],boss:1,mode:'cpu'};

const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const log = (m,c='')=>{G.log.unshift({m,c}); if(G.log.length>300)G.log.pop();};
const jobName = u=>u.isBoss?`${BOSS[u.bossId].n}${BOSS[u.bossId].forms.length>1?'・'+BOSS[u.bossId].forms[u.form]:''}`:JOB[u.job].n;
const nm = u=>u.name+(u.isBoss?'':`(${JOB[u.job].n})`);

/* ---------- ユニット ---------- */
function mkUnit(name,job){
  const j=JOB[job];
  return {id:G.uid++,name,job,side:'p',isBoss:false,atk:j.atk,maxHp:j.hp,hp:j.hp,alive:true,
          restNow:false,restNext:false,guards:job==='tank'?1:0,used:false,converted:false};
}
function bossHp(S,id){return Math.max(1,Math.ceil(BOSS[id].hp(S)));}
function mkBoss(id,S){
  const hp=bossHp(S,id);
  return {id:G.uid++,name:BOSS[id].n,job:'boss',side:'e',isBoss:true,bossId:id,form:0,S,atk:0,
          maxHp:hp,hp,alive:true,restNow:false,restNext:false,guards:0,used:false,converted:false};
}
const row = u=>u.isBoss?[u]:G.units.filter(x=>!x.isBoss&&(G.mode!=='pvp'||x.side===u.side));
const neighbors = u=>{const r=row(u),i=r.indexOf(u);return [r[i-1],r[i+1]].filter(Boolean);};
const foesOf = a=>G.units.filter(u=>u.alive&&u.side!==a.side);

/* ---------- ダメージ処理 ---------- */
const bonus = a=>(a&&a.isBoss&&a.bossId===1&&a.hp*2<=a.maxHp)?2:0;
const dm = (a,n)=>n+bonus(a);

function heal(u,n){
  if(!u.alive)return 0;
  const b=u.hp; u.hp=Math.min(u.maxHp,u.hp+n);
  log(`${nm(u)} は ${u.hp-b} 回復 (HP ${u.hp}/${u.maxHp})`,'heal');
  return u.hp-b;
}

/** events:[{src,to,amt}] を処理。タンクの庇い→同時ダメージ→死亡処理（連鎖あり）。実際に与えた合計を返す */
async function applyEvents(events){
  let total=0, q=events;
  while(q.length){
    q=await protect(q);
    const startAlive=new Set(G.units.filter(u=>u.alive).map(u=>u.id));
    const killer={};
    for(const e of q){
      if(!startAlive.has(e.to.id)||e.amt<=0)continue;
      const real=Math.min(e.amt,Math.max(e.to.hp,0));
      const wasPos=e.to.hp>0;
      e.to.hp-=e.amt; total+=real;
      log(`${nm(e.to)} に ${e.amt} ダメージ${e.src?`（${e.src.name}）`:''} → HP ${Math.max(0,e.to.hp)}/${e.to.maxHp}`,'dmg');
      if(wasPos&&e.to.hp<=0)killer[e.to.id]=e.src;
    }
    const next=[];
    for(const k of G.units.filter(u=>u.alive&&u.hp<=0)){
      if(k.isBoss&&k.form<BOSS[k.bossId].forms.length-1){
        k.form++; k.maxHp=k.hp=bossHp(k.S,k.bossId);
        log(`${k.name} は ${BOSS[k.bossId].forms[k.form]} に変身した！ (HP ${k.hp})`,'sys');
        continue;
      }
      k.alive=false; k.hp=0;
      log(`${nm(k)} は倒れた…`,'sys');
      if(k.job==='bomb'){
        for(const n of neighbors(k)) if(n.alive||startAlive.has(n.id)) next.push({src:k,to:n,amt:3});
        log('💥 ばくだんいわが爆発！','sys');
      }
      const s=killer[k.id];
      if(s&&s.isBoss&&s.bossId===2&&s.form===2&&!k.isBoss&&k.side!==s.side){
        k.side='e';k.alive=true;k.hp=1;k.converted=true;
        log(`${k.name} は魔王の仲間として体力1で復活した！`,'sys');
        for(const f of G.units) if(f.alive&&f.side==='p'&&f.id!==k.id) next.push({src:s,to:f,amt:1});
      }
    }
    q=next;
  }
  return total;
}

/** タンクによる庇い（攻撃元と対象が敵対しているときのみ） */
async function protect(events){
  const out=[];
  for(const e of events){
    let ev=e;
    if(e.src&&e.amt>0&&e.to.alive&&e.src.side!==e.to.side){
      const tanks=G.units.filter(t=>t.alive&&t.job==='tank'&&t.guards>0&&t.side===e.to.side&&t!==e.to);
      if(tanks.length){
        const opts=tanks.map(t=>({label:`${t.name} が代わりに受ける`,sub:`守り残り ${t.guards}`,value:t.id,cls:'ok'}));
        opts.push({label:'庇わない',value:null,cls:'ghost'});
        const c=await ask(`🛡 ${e.to.name} への ${e.amt} ダメージ（${e.src.name}）`,opts,{sub:'タンクが庇いますか？'});
        if(c!==null){const t=G.units.find(x=>x.id===c);t.guards--;log(`🛡 ${t.name} が ${e.to.name} を庇った (守り残り ${t.guards})`,'sys');ev={src:e.src,to:t,amt:e.amt};}
      }
    }
    out.push(ev);
  }
  return out;
}
const dmgTo=(src,targets,amt)=>applyEvents(targets.map(t=>({src,to:t,amt})));
function setRest(t){
  if(!t.alive)return;
  if(t.restNow){log(`${t.name} は今回すでに休みなので連続では休みにならない`);return;}
  t.restNext=true; log(`${t.name} は次の問題休み`,'sys');
}

/* ---------- 行動定義 ---------- */
const P=(label,f)=>({label,f});
function actionsFor(a){
  const L=[]; const add=(label,desc,prompts,run,opt={})=>L.push({label,desc,prompts,run,...opt});
  const alive=u=>u.alive, foe=u=>u.alive&&u.side!==a.side;
  const notIn=(p,f)=>(u,picked)=>f(u)&&!picked.includes(u);
  if(a.isBoss){
    const id=a.bossId;
    if(id===1){
      add('技1','敵1体に3ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],dm(a,3));});
      add('技2','指定1人に2ダメージ、その両隣に1ダメージ',[P('指定する人',foe)],async([t])=>{
        await applyEvents([{src:a,to:t,amt:dm(a,2)},...neighbors(t).map(n=>({src:a,to:n,amt:dm(a,1)}))]);});
    }else if(id===2){
      if(a.form===0){
        add('技1','2人に1ダメージ。その2人は次のターン休み',[P('1人目',foe),P('2人目',notIn(0,foe))],async([x,y])=>{
          await dmgTo(a,[x,y],1);setRest(x);setRest(y);});
        add('技2','1人に3ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],3);});
      }else if(a.form===1){
        add('技1','自分を2回復',[],async()=>{heal(a,2);});
        add('技2','敵に1ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],1);});
      }else{
        add('技1','1人に2ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],2);});
      }
    }else if(id===3){
      add('技1','2人に1ダメージ。その後、与えたダメージ分回復',[P('1人目',foe),P('2人目',notIn(0,foe))],async([x,y])=>{
        const d=await dmgTo(a,[x,y],1);if(d>0)heal(a,d);});
      const pc=G.units.find(u=>u.id===G.prevCorrect);
      add('技2',`直前に正解した相手に4ダメージ${pc?`（${pc.name}）`:'（該当者なし）'}`,[],async()=>{
        const t=G.units.find(u=>u.id===G.prevCorrect);
        if(t&&t.alive&&t.side!==a.side)await dmgTo(a,[t],4);else log('直前の正解者がいないため不発');},
        {disabled:!(pc&&pc.alive&&pc.side!==a.side)});
    }else{
      add('通常ボタンで正解','敵全体に1ダメージ',[],async()=>{await dmgTo(a,foesOf(a),1);});
      add('ディレイボタンで正解','1人を倒す',[P('倒す相手',foe)],async([t])=>{await dmgTo(a,[t],9999);});
    }
    return L;
  }
  // ---- プレイヤー職 ----
  if(a.job==='mw'){
    add(`通常攻撃（敵全体に${dm(a,a.atk)}）`,'常に敵全体へ',[],async()=>{await dmgTo(a,foesOf(a),dm(a,a.atk));});
  }else if(!['sage','monk','warrior','mage','bm','hero','necro'].includes(a.job)||true){
    add(`通常攻撃（${dm(a,a.atk)}）`,'1人に攻撃（自分・味方も可）',[P('攻撃対象',alive)],async([t])=>{await dmgTo(a,[t],dm(a,a.atk));});
  }
  switch(a.job){
    case 'sage': add('蘇生','死んだプレイヤーを体力1で蘇生',[P('蘇生する人',u=>!u.alive&&!u.isBoss&&u.side===a.side)],async([t])=>{
      t.alive=true;t.hp=1;log(`${t.name} が体力1で蘇生した！`,'heal');});break;
    case 'monk': add('回復','1人を3回復',[P('回復する人',alive)],async([t])=>{heal(t,3);});break;
    case 'warrior': add('捨て身の一撃','自身と他1人に5ダメージ',[P('もう1人の対象',u=>u.alive&&u!==a)],async([t])=>{
      await applyEvents([{src:a,to:a,amt:dm(a,5)},{src:a,to:t,amt:dm(a,5)}]);});break;
    case 'mage': add('封じの魔法','1人に1ダメージ＋次の問題休み',[P('対象',alive)],async([t])=>{
      await dmgTo(a,[t],dm(a,1));setRest(t);});break;
    case 'bm': add('必殺の一撃','1人に8ダメージ（バトル中1度だけ）',[P('対象',alive)],async([t])=>{
      a.used=true;await dmgTo(a,[t],dm(a,8));},{disabled:a.used});break;
    case 'hero': add('勇者の剣','自身を3回復し、他1人に4ダメージ',[P('対象',u=>u.alive&&u!==a)],async([t])=>{
      heal(a,3);await dmgTo(a,[t],dm(a,4));});break;
    case 'necro': {
      const n=G.units.filter(u=>!u.alive&&!u.isBoss&&u.side===a.side).length;
      add(`死者の怨念（${n}ダメージ）`,'死んでいる仲間の人数×1ダメージ',[P('対象',alive)],async([t])=>{
        if(n>0)await dmgTo(a,[t],dm(a,n));else log('死んでいる仲間がいない');});break;}
  }
  return L;
}

/* =====================================================================
   モーダル
   ===================================================================== */
function ask(title,opts,{sub='',cancel=true}={}){
  return new Promise((res,rej)=>{
    const m=$('#modal');
    m.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3>${sub?`<p class="sub">${esc(sub)}</p>`:''}<div class="opts">${
      opts.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}" ${o.disabled?'disabled':''}><b>${i+1}. ${esc(o.label)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</button>`).join('')
    }</div>${cancel?'<button class="cancel" data-c="1">キャンセル（この問題の処理を取り消す）</button>':''}</div>`;
    m.classList.add('on');
    m.onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      m.classList.remove('on');m.onclick=null;
      if(b.dataset.c)rej(CANCEL);else res(opts[+b.dataset.i].value);
    };
  });
}
async function pickUnit(label,f,picked){
  const c=G.units.filter(u=>f(u,picked));
  if(!c.length)return null;
  const id=await ask(label,c.map(u=>({label:u.name,sub:`${jobName(u)}　HP ${u.hp}/${u.maxHp}${u.alive?'':'（死亡）'}${u.side==='e'?'　【魔王側】':''}`,value:u.id,cls:u.side==='e'?'foe':''})));
  return G.units.find(u=>u.id===id);
}
async function runAction(act){
  const picked=[];
  for(const p of act.prompts){
    const t=await pickUnit(p.label,p.f,picked);
    if(!t){log('対象がいないため不発');return;}
    picked.push(t);
  }
  await act.run(picked);
}

/* =====================================================================
   進行
   ===================================================================== */
function checkEnd(){
  if(G.over)return;
  if(G.mode==='pvp'){
    const p=G.units.some(u=>u.alive&&u.side==='p'),e=G.units.some(u=>u.alive&&u.side==='e');
    if(!p||!e)G.over=p?'teamp':e?'teame':'draw';
    return;
  }
  if(G.units.filter(u=>u.isBoss).every(b=>!b.alive))G.over='win';
  else if(!G.units.some(u=>u.alive&&u.side==='p'))G.over='lose';
}
function endQuestion(correct){
  for(const u of G.units){u.restNow=u.restNext;u.restNext=false;}
  G.prevCorrect=correct?correct.id:null;
  if(!correct)G.streak=0;
  G.q++; G.sel=null;
  log(`── 第${G.q}問 ──`,'sys');
  checkEnd();
}

async function doCorrect(a){
  log(`⭕ ${nm(a)} 正解！`,'sys');
  G.streak=(G.prevCorrect===a.id)?(G.streak||1)+1:1;
  if(a.job==='tank'){a.guards++;log(`🛡 ${a.name} の守り回数 +1 (${a.guards})`,'sys');}
  if(a.job==='playboy'&&G.streak>=2){
    const h=JOB.hero;a.job='hero';a.atk=h.atk;a.maxHp=h.hp;a.hp=h.hp;
    log(`🎲→👑 ${a.name} は連答で勇者に転職！体力リセット (HP ${a.hp})`,'sys');
  }
  if(a.isBoss&&a.bossId===3&&a.hp===1)heal(a,5);
  const acts=actionsFor(a);
  const noSpecial=acts.every(x=>x.disabled);
  const c=await ask(`${nm(a)} の行動`,[
    ...acts.map((x,i)=>({label:x.label,sub:x.desc,value:i,disabled:x.disabled||!x.prompts.every(p=>G.units.some(u=>p.f(u,[])))})),
    {label:'何もしない',value:-1,cls:'ghost'}],{sub:noSpecial?'使える行動がありません':''});
  if(c>=0)await runAction(acts[c]);
  if(a.job==='thief'&&a.alive&&!G.over){
    const g=await ask('💰 盗賊：次の問題のジャンルを選択',[...GENRES.map(x=>({label:x,value:x})),{label:'選ばない',value:null,cls:'ghost'}]);
    if(g){G.genre=g;G.genreFor=G.q+1;log(`次の問題のジャンル：${g}`,'sys');}
  }
  endQuestion(a);
}
async function doWrong(a){
  log(`❌ ${nm(a)} 誤答`,'sys');
  if(a.isBoss&&!G.cfg.bossPenalty)log('魔王は誤答ペナルティなし');
  else await applyEvents([{src:null,to:a,amt:2}]);
  endQuestion(null);
}
async function doThrow(){
  log('誰も答えず（スルー）','sys');
  for(const b of G.units) if(b.isBoss&&b.alive&&b.bossId===2&&b.form===2)heal(b,1);
  endQuestion(null);
}

/* ---------- トランザクション（取り消し対応） ---------- */
async function transact(fn){
  if(busy||!G||G.over)return;
  busy=true;
  const snap=JSON.stringify(G);
  try{
    await fn();
    undoStack.push(snap); if(undoStack.length>40)undoStack.shift();
    save();
  }catch(e){
    if(e===CANCEL){G=JSON.parse(snap);}
    else{console.error(e);G=JSON.parse(snap);toast('エラーが発生したため処理を取り消しました: '+e.message,4000);}
  }finally{busy=false;render();}
}
function undo(){
  if(busy||!undoStack.length)return;
  G=JSON.parse(undoStack.pop());G.over=null;save();render();
}

/* ---------- 保存 ---------- */
function save(){try{localStorage.setItem('quizrpg_save',JSON.stringify(G));}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem('quizrpg_save'));}catch(e){return null;}}

/* =====================================================================
   描画
   ===================================================================== */
function card(u){
  const pct=Math.max(0,u.hp/u.maxHp*100);
  const chips=[];
  if(u.restNow)chips.push('<span class="chip warn">💤今回休み</span>');
  if(u.restNext)chips.push('<span class="chip">次は休み</span>');
  if(u.job==='tank')chips.push(`<span class="chip warn">🛡守り×${u.guards}</span>`);
  if(u.job==='bm')chips.push(`<span class="chip">${u.used?'技使用済':'技未使用'}</span>`);
  if(JOB[u.job]&&JOB[u.job].tag&&u.job!=='tank')chips.push(`<span class="chip">${esc(JOB[u.job].tag)}</span>`);
  if(u.converted)chips.push('<span class="chip warn">魔王軍に寝返り</span>');
  if(u.isBoss&&u.bossId===1&&bonus(u))chips.push('<span class="chip warn">与ダメ+2</span>');
  if(u.isBoss&&u.bossId===4)chips.push('<span class="chip">通常/ディレイ 2ボタン</span>');
  const prev=lastHp[u.id]; let anim='';
  if(prev!==undefined){if(u.hp<prev)anim='hit';else if(u.hp>prev)anim='heal';}
  const can=u.alive&&!u.restNow&&!G.over;
  const em=qkIcon(u.isBoss?'boss':u.job);
  return `<button class="card ${u.side==='e'?'foe':''} ${can?'can':''} ${G.sel===u.id?'sel':''} ${u.alive?'':'dead'} ${u.restNow?'rest':''} ${anim}" data-id="${u.id}">
    <div style="display:flex;gap:8px;align-items:center"><span class="em">${em}</span><div><div class="nm">${esc(u.name)}</div><div class="jb">${esc(jobName(u))}${u.isBoss?'':` ／ ATK ${u.atk}`}</div></div></div>
    <div class="hpbar"><i style="width:${pct}%"></i></div>
    <div class="hpt"><span>HP ${Math.max(0,u.hp)}/${u.maxHp}</span><span>${u.alive?'':'💀'}</span></div>
    <div class="chips">${chips.join('')}</div></button>`;
}
function render(){
  $('#setup').classList.toggle('hide',!!G);
  $('#game').classList.toggle('hide',!G);
  if(!G){renderSetup();return;}
  $('#qno').textContent=`第${G.q}問`;
  const g=$('#genre'); const show=G.genre&&G.genreFor===G.q;
  g.classList.toggle('hide',!show); if(show)g.textContent=`ジャンル：${G.genre}`;
  $('#foeLabel').textContent=G.mode==='pvp'?'チームB':'魔王軍';
  $('#plabel').textContent=G.mode==='pvp'?'チームA':'プレイヤー';
  $('#foes').innerHTML=G.units.filter(u=>u.side==='e').map(card).join('');
  $('#pls').innerHTML=G.units.filter(u=>u.side==='p').map(card).join('');
  for(const u of G.units){const p=lastHp[u.id];if(p!==undefined&&p!==u.hp){const el=document.querySelector(`.card[data-id="${u.id}"]`);
    if(el){const f=document.createElement('div');f.className='float '+(u.hp<p?'d':'h');f.textContent=(u.hp>p?'+':'')+(u.hp-p);el.appendChild(f);setTimeout(()=>f.remove(),1100);}}}
  lastHp={};for(const u of G.units)lastHp[u.id]=u.hp;
  const c=$('#ctl');
  if(G.over)c.innerHTML='';
  else if(G.sel==null)c.innerHTML=`<div>${net.on?'🔔 受付中… 押された人が自動で選ばれます（手動でカードをタップも可）':'早押しで答えた人のカードをタップ'}</div>${net.on&&net.rank?`<div class="sub">${esc(net.rank)}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${net.on?'<button class="btn" id="bReopen">受付やり直し<kbd>R</kbd></button>':''}<button class="btn" id="bThrow">誰も答えず（スルー）<kbd>S</kbd></button></div>`;
  else{const u=G.units.find(x=>x.id===G.sel);
    c.innerHTML=`<div style="font-size:1.3rem"><b style="color:var(--acc)">${esc(nm(u))}</b> が回答</div>${net.on&&net.rank?`<div class="sub">${esc(net.rank)}</div>`:''}<div style="display:flex;gap:12px"><button class="btn ok" id="bOk">⭕ 正解<kbd>O</kbd></button><button class="btn ng" id="bNg">❌ 誤答<kbd>X</kbd></button></div><button class="btn" id="bRe">選び直し<kbd>R</kbd></button>`;}
  $('#log').innerHTML=G.log.map(l=>`<p class="${l.c}">${esc(l.m)}</p>`).join('');
  $('#undoBtn').disabled=!undoStack.length;
  updateRoomInfo();publish();
  const o=$('#over');o.classList.toggle('on',!!G.over);
  if(G.over){
    const T={win:'🎉 勝利！',lose:'💀 全滅…',teamp:'🏆 チームA の勝利！',teame:'🏆 チームB の勝利！',draw:'引き分け'};
    $('#overT').textContent=T[G.over];
    $('#overT').style.color=G.over==='lose'?'var(--red)':'var(--acc)';
    $('#overS').textContent=`${G.q-1}問で決着`;
  }
}
function renderSetup(){
  const pvp=setup.mode==='pvp';
  $('#modeCpu').classList.toggle('sel',!pvp);$('#modePvp').classList.toggle('sel',pvp);
  $('#bossBox').classList.toggle('hide',pvp);$('#penBox').classList.toggle('hide',pvp);
  $('#plist').innerHTML=setup.players.map((p,i)=>`<div class="prow">${pvp?`<select data-i="${i}" data-k="team"><option value="p" ${p.team==='p'?'selected':''}>チームA</option><option value="e" ${p.team==='e'?'selected':''}>チームB</option></select>`:''}<input data-i="${i}" data-k="name" value="${esc(p.name)}"><select data-i="${i}" data-k="job">${
    SELECTABLE.map(j=>`<option value="${j}" ${p.job===j?'selected':''}>${JOB[j].n}（ATK${JOB[j].atk}/HP${JOB[j].hp}）</option>`).join('')}</select><button class="btn" data-del="${i}">✕</button></div>`).join('');
  $('#bosslist').innerHTML=Object.keys(BOSS).map(id=>`<button class="bossopt ${setup.boss==id?'sel':''}" data-boss="${id}"><b>${qkIcon('boss')} ${BOSS[id].n}</b><small>${esc(BOSS[id].d)}</small></button>`).join('');
  $('#contBtn').classList.toggle('hide',!loadSave());
}

/* =====================================================================
   ルール表示
   ===================================================================== */
function showRules(){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox"><h3>職業・ルール一覧</h3>
  <p class="sub">共通ルール：①正解時に通常攻撃または能力を発動 ②誤答は役職に関係なく2ダメージ ③休みは連続にならない ④自分や自チームも攻撃可能 ⑤勇者転職時は体力リセット ⑥タンクは死んでも守り回数を継続 ⑦タンクは範囲攻撃で自分が死ぬ場合も庇える</p>
  <table class="rules">${Object.entries(JOB).map(([k,j])=>`<tr><th>${qkIcon(k)} ${j.n}</th><td>ATK${j.atk}/HP${j.hp}<br>${esc(j.d)}</td></tr>`).join('')}
  ${Object.entries(BOSS).map(([k,b])=>`<tr><th>${qkIcon('boss')} ${b.n}</th><td>${esc(b.d)}</td></tr>`).join('')}</table>
  <button class="cancel" data-c="1">閉じる</button></div>`;
  m.classList.add('on');
  m.onclick=e=>{if(e.target.closest('button')||e.target===m){m.classList.remove('on');m.onclick=null;}};
}

/* =====================================================================
   イベント
   ===================================================================== */
function startGame(){
  const ps=setup.players.filter(p=>p.name.trim());
  if(!ps.length){toast('プレイヤーを追加してください');return;}
  const pvp=setup.mode==='pvp';
  if(pvp&&(!ps.some(p=>p.team==='p')||!ps.some(p=>p.team==='e'))){toast('両チームに1人以上必要です');return;}
  G={mode:setup.mode,uid:1,units:[],log:[],q:1,prevCorrect:null,streak:0,genre:null,genreFor:0,sel:null,over:null,
     cfg:{bossPenalty:$('#optPen').checked}};
  G.pids={};
  ps.forEach(p=>{const u=mkUnit(p.name.trim(),p.job);if(pvp)u.side=p.team;G.units.push(u);if(p.pid)G.pids[p.pid]=u.id;});
  if(pvp){
    G.units.sort((a,b)=>(a.side==='p'?0:1)-(b.side==='p'?0:1)); // チームごとに席順を連続させる
    log('対戦開始！ チームA vs チームB','sys');
  }else{
    const S=G.units.reduce((s,u)=>s+u.atk,0);
    G.units.push(mkBoss(+setup.boss,S));
    const b=G.units[G.units.length-1];
    log(`バトル開始！ ${b.name} (HP ${b.hp}) ／ プレイヤー攻撃合計 ${S}`,'sys');
  }
  log('── 第1問 ──','sys');
  undoStack=[];lastHp={};save();render();
}
$('#addP').onclick=()=>{setup.players.push({name:`プレイヤー${setup.players.length+1}`,job:'warrior',team:setup.players.length%2?'e':'p'});renderSetup();};
$('#plist').addEventListener('input',e=>{const t=e.target;if(t.dataset.k)setup.players[+t.dataset.i][t.dataset.k]=t.value;});
$('#plist').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b){setup.players.splice(+b.dataset.del,1);renderSetup();}});
$('#bosslist').addEventListener('click',e=>{const b=e.target.closest('[data-boss]');if(b){setup.boss=b.dataset.boss;renderSetup();}});
$('#modeCpu').onclick=()=>{setup.mode='cpu';renderSetup();};
$('#modePvp').onclick=()=>{setup.mode='pvp';renderSetup();};
$('#startBtn').onclick=startGame;
$('#contBtn').onclick=()=>{const s=loadSave();if(s){G=s;undoStack=[];render();}};
$('#rulesBtn1').onclick=$('#rulesBtn2').onclick=showRules;
$('#undoBtn').onclick=undo;
$('#quitBtn').onclick=()=>{if(confirm('最初の設定画面に戻りますか？（進行中のバトルは破棄されます）')){G=null;net.openedFor=null;netSend({t:'endgame'});render();}};
$('#overBtn').onclick=()=>{G=null;net.openedFor=null;netSend({t:'endgame'});render();};
$('#game').addEventListener('click',e=>{
  if(busy||!G||G.over)return;
  const card=e.target.closest('.card');
  if(card){const u=G.units.find(x=>x.id==card.dataset.id);if(u&&u.alive&&!u.restNow){G.sel=G.sel===u.id?null:u.id;if(G.sel!=null)netSend({t:'lock'});else openBuzz(true);render();}return;}
  const id=e.target.id;
  if(id==='bThrow')transact(doThrow);
  else if(id==='bRe'){G.sel=null;openBuzz(true);render();}
  else if(id==='bReopen'){openBuzz(true);}
  else if(id==='bOk'){const a=G.units.find(x=>x.id===G.sel);transact(()=>doCorrect(a));}
  else if(id==='bNg'){const a=G.units.find(x=>x.id===G.sel);transact(()=>doWrong(a));}
});

/* =====================================================================
   オンライン連携（server.js と通信）
   ===================================================================== */
const net={on:false,ws:null,room:null,lobby:[],openedFor:null,rank:''};
function netSend(m){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(m));}
const ROOM=new URLSearchParams(location.search).get('id');
function toast(msg,ms=2500){const d=document.createElement('div');d.className='t';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms);}
let actx=null,soundOn=true;try{soundOn=localStorage.getItem('qr_sound_host')!=='0';}catch(e){}
function tone(f,d,type,vol,when){if(!soundOn)return;try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
function beep(){tone(880,.12,'triangle',.18);tone(1175,.18,'triangle',.15,.1);}
function setSound(on){soundOn=on;try{localStorage.setItem('qr_sound_host',on?'1':'0');}catch(e){}$('#sndBtn').textContent=on?'🔊':'🔇';}
$('#sndBtn').onclick=()=>setSound(!soundOn);setSound(soundOn);
$('#copyUrl').onclick=async()=>{const u=`${location.origin}/play.html?id=${ROOM}`;try{await navigator.clipboard.writeText(u);toast('参加用URLをコピーしました');}catch(e){toast(u,6000);}};
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.metaKey||e.altKey)return;
  const m=$('#modal');
  if(m.classList.contains('on')){
    if(e.key==='Escape'){const c=m.querySelector('.cancel');if(c)c.click();return;}
    const opts=[...m.querySelectorAll('.opt')],n=parseInt(e.key);
    if(n>=1&&opts[n-1]&&!opts[n-1].disabled){e.preventDefault();opts[n-1].click();}
    return;
  }
  if(!G||G.over||busy)return;
  const k=e.key.toLowerCase();
  if(e.ctrlKey&&k==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey)return;
  if(k==='o')$('#bOk')&&$('#bOk').click();
  else if(k==='x')$('#bNg')&&$('#bNg').click();
  else if(k==='s')$('#bThrow')&&$('#bThrow').click();
  else if(k==='r')($('#bReopen')||$('#bRe'))&&($('#bReopen')||$('#bRe')).click();
});
function leaveToList(){location.href='/';}
function netConnect(){
  if(!ROOM){leaveToList();return;}
  const ws=net.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?id='+ROOM);
  ws.onopen=()=>{
    const k=localStorage.getItem('qr_hk_'+ROOM);
    if(!k){leaveToList();return;}
    netSend({t:'host_resume',id:ROOM,hostKey:k});
  };
  ws.onclose=()=>{if(net.on&&!net.closing)setTimeout(netConnect,1500);};
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.t==='created'){net.on=true;net.room=m.room;net.roomName=m.name;net.openedFor=null;renderSetupOnline();if(G)render();}
    else if(m.t==='error'){localStorage.removeItem('qr_hk_'+ROOM);toast(m.msg,3000);net.on=false;net.closing=true;setTimeout(leaveToList,1500);}
    else if(m.t==='lobby'){
      for(const p of m.players){const o=net.lobby.find(x=>x.pid===p.pid);
        if(!o)toast(`${p.name} が入室しました`);else if(!o.online&&p.online)toast(`${p.name} が再接続しました`);else if(o.online&&!p.online)toast(`${p.name} の接続が切れました`);}
      net.lobby=m.players;renderSetupOnline();if(G)render();}
    else if(m.t==='winner'){
      beep(m);net.rank=m.ranking.map((x,i)=>`${i+1}. ${x.name}${i?` (+${Math.round(x.ms)}ms)`:''}`).join('　');
      if(G&&!busy&&!G.over&&G.sel==null&&G.pids&&G.pids[m.pid]!=null){
        const u=G.units.find(x=>x.id===G.pids[m.pid]);
        if(u&&u.alive&&!u.restNow)G.sel=u.id;
      }
      if(G)render();
    }
  };
}
function closeRoomNow(){
  if(!confirm('部屋を閉じますか？参加者は全員退室になります。'))return;
  net.closing=true;netSend({t:'close'});localStorage.removeItem('qr_hk_'+ROOM);setTimeout(leaveToList,200);
}
function updateRoomInfo(){
  const el=$('#roomInfo');if(!el)return;
  el.textContent=net.on?`${net.room}番「${net.roomName}」　👥${net.lobby.filter(p=>p.online).length}`:'接続中…';
}
function renderSetupOnline(){
  updateRoomInfo();
  $('#onOff').classList.toggle('hide',net.on);$('#onOn').classList.toggle('hide',!net.on);
  if(!net.on)return;
  $('#onCode').textContent=`${net.room}番「${net.roomName}」`;
  $('#onUrl').textContent=`${location.origin}/play.html?id=${net.room}`;
  $('#onList').innerHTML=net.lobby.length?net.lobby.map(p=>`<span class="chip" style="font-size:.85rem;padding:2px 8px;margin-right:4px">${p.online?'🟢':'⚪'} ${esc(p.name)}${p.flavor?` 〈${esc(p.flavor)}〉`:''}（${esc(JOB[p.job]?JOB[p.job].n:p.job)}）</span>`).join(''):'<span class="sub">参加者を待っています…</span>';
}
function openBuzz(force){
  if(!net.on||!G||G.over)return;
  if(!force&&net.openedFor===G.q)return;
  net.openedFor=G.q;net.rank='';
  const eligible={};
  for(const [pid,uid] of Object.entries(G.pids||{})){
    const u=G.units.find(x=>x.id===uid);
    if(u&&u.alive&&!u.restNow)eligible[pid]=u.job==='berserker'?700:0; // バーサーカーは常にディレイ
  }
  netSend({t:'open',q:G.q,eligible});
}
function publish(){
  if(!net.on||!G)return;
  netSend({t:'state',state:{mode:G.mode,q:G.q,over:G.over,pids:G.pids,sel:G.sel,
    genre:(G.genre&&G.genreFor===G.q)?`ジャンル：${G.genre}`:'',
    units:G.units.map(u=>({id:u.id,name:u.name,job:u.job,jobName:jobName(u),side:u.side,hp:u.hp,maxHp:u.maxHp,alive:u.alive,restNow:u.restNow,guards:u.guards})),
    log:G.log.slice(0,12).map(l=>l.m)}});
  if(G.sel==null&&!G.over)openBuzz(false);
}
$('#closeRoom1').onclick=$('#closeRoom2').onclick=closeRoomNow;
$('#onImport').onclick=()=>{
  if(!net.lobby.length)return;
  setup.players=net.lobby.map(p=>({name:p.name,job:JOB[p.job]&&SELECTABLE.includes(p.job)?p.job:'warrior',team:p.team||'p',pid:p.pid}));
  renderSetup();
};
netConnect();
render();
</script>
