<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14110e">
<title>QUIZ KNIGHTS - 進行役</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/icons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
:root{--rubric:#7a1f26}
.page{max-width:1120px;margin:0 auto;padding:18px 18px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .logo{font-size:1.25rem}
.grid2{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.col-side{position:static}}
.roomtitle{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;background:#120f0c;border:2px solid var(--gold);color:var(--gold);flex:none}
.roomtitle b{font-size:1.2rem;font-family:var(--serif)}
.urlrow{display:flex;gap:8px}.urlrow .input{flex:1;font-size:.85rem;color:var(--mut)}
.rrow{display:grid;grid-template-columns:42px minmax(110px,1fr) minmax(130px,176px) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--s2)}
.rrow.pvp{grid-template-columns:42px minmax(110px,1fr) minmax(130px,176px) auto auto}
@media(max-width:560px){.rrow,.rrow.pvp{grid-template-columns:42px 1fr auto}.rrow select.input{grid-column:1/-1}.rrow .seg{grid-column:1/-1}}
.rrow .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:#120f0c;border:2px solid var(--line2);flex:none}
.rrow .rname{min-width:0}
.rrow .rname .input{padding:6px 10px;font-weight:700}
.rrow .rname .sub{display:flex;align-items:center;gap:6px;margin-top:2px}
.rrow select.input{width:100%}
.rrow .seg button{padding:6px 12px}
.rrow .seg button.sel.tp{background:var(--blu);color:#06182b}.rrow .seg button.sel.te{background:var(--red);color:#2b0609}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--mut);margin-bottom:10px}
.empty b{display:block;color:var(--tx)}
.bopt{display:flex;gap:12px;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--s2);cursor:pointer;margin-bottom:8px;align-items:flex-start}
.bopt:hover{border-color:var(--line2)}
.bopt.sel{border-color:var(--gold);background:#3a2f1a;box-shadow:0 0 0 1px var(--gold)}
.bopt .bi{font-size:1.8rem;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#120f0c;border:2px solid var(--red-d);flex:none}
.bopt.sel .bi{border-color:var(--gold)}
.bopt b{display:block}
.bopt small{display:block;color:var(--mut);font-size:.78rem;line-height:1.4}
.switch{display:flex;align-items:center;gap:10px;margin-top:6px;cursor:pointer;font-size:.9rem}
.switch input{width:18px;height:18px;accent-color:var(--gold)}
.startbar{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#2d2414,#1e1914)}
.startbar .sub{text-align:center}

/* ===== バトル画面 ===== */
.gbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:#14110ee6;position:sticky;top:0;z-index:30}
.gl{display:flex;align-items:center;gap:12px;min-width:0}
.gc{display:flex;align-items:center;gap:10px}
.gr{display:flex;gap:8px;justify-content:flex-end;position:relative}
.qno{font-family:var(--serif);font-size:1.7rem;font-weight:800;color:var(--gold)}
.chip.pur{border-color:var(--pur);color:#d3b6ee}
.chip.room{cursor:pointer;background:var(--s2);padding:4px 12px}
.chip.room:hover{border-color:var(--gold)}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:230px;z-index:40;box-shadow:0 14px 34px #000d}
.mi{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;background:none;border:0;border-radius:8px;text-align:left;cursor:pointer}
.mi:hover{background:var(--s3)}.mi.danger{color:#ff9aa2}.mi hr{border:0}
.mhr{height:1px;background:var(--line);margin:4px 6px}
.layout2{display:grid;grid-template-columns:1fr 360px;gap:22px;max-width:1300px;margin:0 auto;padding:18px}
#stage{min-width:0}
.team-label{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 0 10px}
.team-label::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.team-label.foe{color:#ff9aa2}.team-label.ally{color:#9cc8ee}
.team-label::after{content:"";flex:1;height:1px;background:var(--line)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-bottom:22px}
#foes{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
#foes .unit{width:min(100%,176px)}
#foes .unit:only-child{width:min(100%,300px)}
#foes .unit:only-child .ic-wrap{width:64px;height:64px;font-size:2.4rem}
#foes .unit:only-child .nm{font-size:1.2rem}
.unit .u-in{padding:14px 10px 26px}
#pls .unit .nm{font-size:1rem}
/* 進行パネル（常に同じ位置） */
#side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 92px)}
#ctl{padding:16px;display:flex;flex-direction:column;gap:12px;transition:.15s}
#ctl.answering{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 28px #e3b84f33}
.ctl-state{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem;font-weight:500}
#ctl.waiting .ctl-state .dot{background:var(--blu);box-shadow:0 0 8px var(--blu);animation:pl 1.2s infinite}
#ctl.answering .ctl-state{color:var(--gold)}
@keyframes pl{50%{opacity:.35}}
.ctl-who{font-family:var(--serif);font-size:1.45rem;font-weight:800;min-height:2.2rem;line-height:1.2}
.ctl-who.none{color:var(--dim);font-size:1rem;font-family:var(--sans);font-weight:400;display:flex;align-items:center}
.ctl-rank{font-size:.8rem;color:var(--mut);min-height:1.2em}
.ctl-main{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl-main .btn{flex-direction:column;gap:2px;padding:16px 8px}
.ctl-main .btn svg{width:26px;height:26px}
.ctl-main kbd{font-size:.65rem}
.ctl-sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#logWrap{border-radius:12px;padding:12px 16px;overflow:auto;flex:1;min-height:120px;box-shadow:inset 0 0 40px #8a6a3566}
.log-h{text-align:center;font-family:var(--serif);font-weight:800;color:var(--rubric);letter-spacing:.3em;margin-bottom:6px}
#log p{margin:0 0 6px;padding-bottom:6px;border-bottom:1px dotted #8a6a3577;font-size:.85rem}
#log p.sys{color:var(--rubric);font-weight:700}#log p.dmg{color:#9a2630}#log p.heal{color:#2f6a2a}
@media(max-width:900px){
  .gbar{display:flex;justify-content:space-between;padding:8px 12px}.gl{display:none}.qno{white-space:nowrap;font-size:1.5rem}
  kbd{display:none}
  .layout2{grid-template-columns:1fr;padding:12px 12px 260px}
  #side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;max-height:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#14110ecc,#14110e 30%);border-top:1px solid var(--line2);gap:8px}
  #logWrap{display:none}
  #ctl{padding:10px;gap:8px}.ctl-who{font-size:1.15rem;min-height:1.6rem}
  .ctl-main .btn{flex-direction:row;padding:12px 8px;gap:8px}
  .units{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
}
/* モーダル */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:70}
#modal.on{display:flex}
#modal .mbox{background:var(--s1);border:1px solid var(--gold);border-radius:16px;padding:22px;max-width:580px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #000}
#modal h3{margin-bottom:6px;font-size:1.2rem;color:var(--gold)}
#modal .opts{display:grid;gap:8px;margin-top:12px}
.opt{background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;text-align:left;cursor:pointer;transition:.1s}
.opt:hover:not(:disabled){border-color:var(--gold);background:var(--s3)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt small{display:block;color:var(--mut);font-weight:400}
.opt.foe{border-color:var(--red-d)}.opt.ghost{background:transparent}.opt.ok{border-color:var(--grn-d)}
.opt b{font-variant-numeric:tabular-nums}
.cancel{margin-top:14px;width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--mut);cursor:pointer}
.cancel:hover{border-color:var(--line2);color:var(--tx)}
table.rules{border-collapse:collapse;width:100%;font-size:.86rem;margin-top:10px}
table.rules td,table.rules th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.rules th{white-space:nowrap;color:var(--gold)}
#over{position:fixed;inset:0;background:radial-gradient(circle,#000a,#000f);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:60;text-align:center}
#over.on{display:flex}
#over h2{font-size:3.4rem;text-shadow:0 0 30px currentColor}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<div id="setup" class="page">
  <div class="topbar">
    <div class="logo">QUIZ KNIGHTS <span class="sub" style="letter-spacing:0;font-family:var(--sans)">／ 進行役：バトルの準備</span></div>
    <div style="display:flex;gap:8px"><button class="btn sm" id="rulesBtn1">職業・ルール一覧</button><button class="btn sm danger" id="closeRoom1">部屋を閉じる</button></div>
  </div>

  <div class="grid2">
    <section class="col-main">
      <div class="panel">
        <div class="roomtitle"><div class="num" id="onNum">-</div><div><b id="onName">接続中…</b><div class="sub">下のURLを参加者に送るか、部屋一覧の「参加」から入室してもらいます</div></div></div>
        <div class="urlrow"><input class="input" id="onUrl" readonly><button class="btn primary" id="copyUrl2">URLをコピー</button></div>
      </div>

      <div class="panel">
        <h3>参加者 <span class="chip" id="rosterCount">0人</span></h3>
        <div id="plist"></div>
        <div id="rosterEmpty" class="empty hide"><b>参加者を待っています…</b>URLを共有してください。入室した人は、ここに自動で追加されます。</div>
        <button class="btn ghost sm" id="addP">＋ その場にいる人を手動で追加</button>
      </div>
    </section>

    <aside class="col-side">
      <div class="panel">
        <h3>モード</h3>
        <div class="seg" id="modeSeg"><button id="modeCpu">CPU戦</button><button id="modePvp">ユーザー対戦</button></div>
        <div class="sub" id="modeDesc" style="margin-top:8px"></div>
      </div>
      <div class="panel" id="bossBox">
        <h3>魔王を選ぶ</h3>
        <div id="bosslist"></div>
        <label class="switch" id="penBox"><input type="checkbox" id="optPen" checked><span>魔王も誤答で2ダメージを受ける</span></label>
      </div>
      <div class="startbar">
        <button class="btn primary xl wide" id="startBtn">バトル開始</button>
        <div class="sub" id="startHint"></div>
        <button class="btn ghost sm" id="contBtn">前回の続きから再開</button>
      </div>
    </aside>
  </div>
</div>

<!-- ================= GAME ================= -->
<div id="game" class="hide">
  <header class="gbar">
    <div class="gl"><span class="logo">QUIZ KNIGHTS</span><button class="chip room" id="roomChip" title="参加用URLをコピー"><span id="roomInfo">接続中…</span></button></div>
    <div class="gc"><span class="qno" id="qno"></span><span class="chip pur hide" id="genre"></span></div>
    <div class="gr">
      <button class="btn sm" id="undoBtn">↩ 1つ戻す<kbd>Ctrl+Z</kbd></button>
      <button class="btn sm" id="menuBtn" aria-haspopup="true">メニュー ▾</button>
      <div class="menu-pop hide" id="menu">
        <button class="mi" id="rulesBtn2">📖 職業・ルール一覧</button>
        <button class="mi" id="copyUrl">🔗 参加用URLをコピー</button>
        <button class="mi" id="sndBtn">🔊 効果音</button>
        <div class="mhr"></div>
        <button class="mi danger" id="quitBtn">↺ 最初からやり直す</button>
        <button class="mi danger" id="closeRoom2">✕ 部屋を閉じる</button>
      </div>
    </div>
  </header>
  <div class="layout2">
    <main id="stage">
      <div class="team-label foe" id="foeLabel">魔王軍</div>
      <div id="foes"></div>
      <div class="team-label ally" id="plabel" style="margin-top:8px">プレイヤー</div>
      <div class="units" id="pls"></div>
    </main>
    <aside id="side">
      <div id="ctl" class="panel waiting"></div>
      <div id="logWrap" class="parch"><div class="log-h">年代記</div><div id="log"></div></div>
    </aside>
  </div>
</div>

<div id="toast"></div>
<div id="modal"></div>
<div id="over"><h2 id="overT"></h2><div id="overS" class="sub"></div><button class="btn primary lg" id="overBtn">準備画面に戻る</button></div>

<script>
'use strict';
/* =====================================================================
   データ定義（数値の調整はここだけ触ればOK）
   ===================================================================== */
const JOB = {
  sage:     {n:'賢者',        e:'📿', atk:1, hp:5,  d:'通常攻撃の代わりに：死んだプレイヤー1人を体力1で蘇生'},
  monk:     {n:'僧侶',        e:'🙏', atk:1, hp:6,  d:'通常攻撃の代わりに：1人を3回復'},
  warrior:  {n:'戦士',        e:'🗡', atk:3, hp:7,  d:'通常攻撃の代わりに：自身と他1人に5ダメージ'},
  mage:     {n:'魔法使い',    e:'🔮', atk:3, hp:5,  d:'通常攻撃の代わりに：1人に1ダメージ＋そのプレイヤーは次の問題休み'},
  bm:       {n:'バトルマスター',e:'⚔', atk:5, hp:2,  d:'通常攻撃の代わりに：1人に8ダメージ（バトル中1度だけ）'},
  tank:     {n:'タンク',      e:'🛡', atk:1, hp:10, d:'仲間への攻撃を代わりに受けられる（権利は開始時1、正解で+1。死んでも継続）', tag:'🛡'},
  berserker:{n:'バーサーカー',e:'🪓', atk:7, hp:7,  d:'常にボタンにディレイがつく', tag:'⏱ディレイ'},
  mw:       {n:'魔法戦士',    e:'✨', atk:2, hp:5,  d:'通常攻撃が常に敵全体への攻撃になる'},
  thief:    {n:'盗賊',        e:'💰', atk:2, hp:4,  d:'正解したら次の問題のジャンルを選択（理系/文系/青問/緑問/赤問）'},
  playboy:  {n:'遊び人',      e:'🎲', atk:0, hp:3,  d:'連答（同じ人が連続正解）したら「勇者」に転職（体力リセット）'},
  hero:     {n:'勇者',        e:'👑', atk:7, hp:7,  d:'通常攻撃の代わりに：自身を3回復し、他1人に4ダメージ'},
  bomb:     {n:'ばくだんいわ',e:'💣', atk:1, hp:5,  d:'死んだら両隣に3ダメージ（同時に死んだ仲間も蘇生対象）', tag:'💥'},
  necro:    {n:'ネクロマンサー',e:'💀',atk:1, hp:5,  d:'通常攻撃の代わりに：1人に（死んでいる仲間の人数×1）ダメージ'}
};
const SELECTABLE = ['sage','monk','warrior','mage','bm','tank','berserker','mw','thief','playboy','bomb','necro']; // 勇者は転職専用
const GENRES = ['理系','文系','青問','緑問','赤問'];

const BOSS = {
  1:{n:'魔王1', e:'👹', forms:['通常'],
     hp:S=>S*1.5, d:'HP=攻撃合計×1.5 / 技1:敵1体に3 / 技2:指定1人に2＋両隣に1 / 残りHP半分以下で与ダメージ+2'},
  2:{n:'魔王2', e:'😈', forms:['第1形態','第2形態','第3形態'],
     hp:S=>S*0.5, d:'3形態（各HP=攻撃合計×0.5）。倒すと次の形態へ。第3形態は倒した敵を体力1で仲間に（死んでも魔王側）／スルーで1回復／敵撃破時に敵全体へ1ダメージ'},
  3:{n:'魔王3', e:'🐲', forms:['通常'],
     hp:S=>S*2, d:'HP=攻撃合計×2 / 技1:2人に1ダメージ後その分回復 / 技2:直前正解者に4 / 残りHP1で正解すると5回復'},
  4:{n:'魔王4', e:'👁', forms:['通常'],
     hp:S=>S*1, d:'HP=攻撃合計×1 / ボタン2種：通常ボタン正解=敵全体に1 / ディレイボタン正解=1人を倒す'}
};

/* =====================================================================
   状態
   ===================================================================== */
const $ = s=>document.querySelector(s);
const CANCEL = Symbol('cancel');
let G = null;            // ゲーム状態（JSONで保存・巻き戻し可能なプレーンデータのみ）
let undoStack = [];
let busy = false;
let lastHp = {};
let setup = {players:[],boss:1,mode:'cpu'};

const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const log = (m,c='')=>{G.log.unshift({m,c}); if(G.log.length>300)G.log.pop();};
const jobName = u=>u.isBoss?`${BOSS[u.bossId].n}${BOSS[u.bossId].forms.length>1?'・'+BOSS[u.bossId].forms[u.form]:''}`:JOB[u.job].n;
const nm = u=>u.name+(u.isBoss?'':`(${JOB[u.job].n})`);

/* ---------- ユニット ---------- */
function mkUnit(name,job){
  const j=JOB[job];
  return {id:G.uid++,name,job,side:'p',isBoss:false,atk:j.atk,maxHp:j.hp,hp:j.hp,alive:true,
          restNow:false,restNext:false,guards:job==='tank'?1:0,used:false,converted:false};
}
function bossHp(S,id){return Math.max(1,Math.ceil(BOSS[id].hp(S)));}
function mkBoss(id,S){
  const hp=bossHp(S,id);
  return {id:G.uid++,name:BOSS[id].n,job:'boss',side:'e',isBoss:true,bossId:id,form:0,S,atk:0,
          maxHp:hp,hp,alive:true,restNow:false,restNext:false,guards:0,used:false,converted:false};
}
const row = u=>u.isBoss?[u]:G.units.filter(x=>!x.isBoss&&(G.mode!=='pvp'||x.side===u.side));
const neighbors = u=>{const r=row(u),i=r.indexOf(u);return [r[i-1],r[i+1]].filter(Boolean);};
const foesOf = a=>G.units.filter(u=>u.alive&&u.side!==a.side);

/* ---------- ダメージ処理 ---------- */
const bonus = a=>(a&&a.isBoss&&a.bossId===1&&a.hp*2<=a.maxHp)?2:0;
const dm = (a,n)=>n+bonus(a);

function heal(u,n){
  if(!u.alive)return 0;
  const b=u.hp; u.hp=Math.min(u.maxHp,u.hp+n);
  log(`${nm(u)} は ${u.hp-b} 回復 (HP ${u.hp}/${u.maxHp})`,'heal');
  return u.hp-b;
}

/** events:[{src,to,amt}] を処理。タンクの庇い→同時ダメージ→死亡処理（連鎖あり）。実際に与えた合計を返す */
async function applyEvents(events){
  let total=0, q=events;
  while(q.length){
    q=await protect(q);
    const startAlive=new Set(G.units.filter(u=>u.alive).map(u=>u.id));
    const killer={};
    for(const e of q){
      if(!startAlive.has(e.to.id)||e.amt<=0)continue;
      const real=Math.min(e.amt,Math.max(e.to.hp,0));
      const wasPos=e.to.hp>0;
      e.to.hp-=e.amt; total+=real;
      log(`${nm(e.to)} に ${e.amt} ダメージ${e.src?`（${e.src.name}）`:''} → HP ${Math.max(0,e.to.hp)}/${e.to.maxHp}`,'dmg');
      if(wasPos&&e.to.hp<=0)killer[e.to.id]=e.src;
    }
    const next=[];
    for(const k of G.units.filter(u=>u.alive&&u.hp<=0)){
      if(k.isBoss&&k.form<BOSS[k.bossId].forms.length-1){
        k.form++; k.maxHp=k.hp=bossHp(k.S,k.bossId);
        log(`${k.name} は ${BOSS[k.bossId].forms[k.form]} に変身した！ (HP ${k.hp})`,'sys');
        continue;
      }
      k.alive=false; k.hp=0;
      log(`${nm(k)} は倒れた…`,'sys');
      if(k.job==='bomb'){
        for(const n of neighbors(k)) if(n.alive||startAlive.has(n.id)) next.push({src:k,to:n,amt:3});
        log('💥 ばくだんいわが爆発！','sys');
      }
      const s=killer[k.id];
      if(s&&s.isBoss&&s.bossId===2&&s.form===2&&!k.isBoss&&k.side!==s.side){
        k.side='e';k.alive=true;k.hp=1;k.converted=true;
        log(`${k.name} は魔王の仲間として体力1で復活した！`,'sys');
        for(const f of G.units) if(f.alive&&f.side==='p'&&f.id!==k.id) next.push({src:s,to:f,amt:1});
      }
    }
    q=next;
  }
  return total;
}

/** タンクによる庇い（攻撃元と対象が敵対しているときのみ） */
async function protect(events){
  const out=[];
  for(const e of events){
    let ev=e;
    if(e.src&&e.amt>0&&e.to.alive&&e.src.side!==e.to.side){
      const tanks=G.units.filter(t=>t.alive&&t.job==='tank'&&t.guards>0&&t.side===e.to.side&&t!==e.to);
      if(tanks.length){
        const opts=tanks.map(t=>({label:`${t.name} が代わりに受ける`,sub:`守り残り ${t.guards}`,value:t.id,cls:'ok'}));
        opts.push({label:'庇わない',value:null,cls:'ghost'});
        const c=await ask(`🛡 ${e.to.name} への ${e.amt} ダメージ（${e.src.name}）`,opts,{sub:'タンクが庇いますか？'});
        if(c!==null){const t=G.units.find(x=>x.id===c);t.guards--;log(`🛡 ${t.name} が ${e.to.name} を庇った (守り残り ${t.guards})`,'sys');ev={src:e.src,to:t,amt:e.amt};}
      }
    }
    out.push(ev);
  }
  return out;
}
const dmgTo=(src,targets,amt)=>applyEvents(targets.map(t=>({src,to:t,amt})));
function setRest(t){
  if(!t.alive)return;
  if(t.restNow){log(`${t.name} は今回すでに休みなので連続では休みにならない`);return;}
  t.restNext=true; log(`${t.name} は次の問題休み`,'sys');
}

/* ---------- 行動定義 ---------- */
const P=(label,f)=>({label,f});
function actionsFor(a){
  const L=[]; const add=(label,desc,prompts,run,opt={})=>L.push({label,desc,prompts,run,...opt});
  const alive=u=>u.alive, foe=u=>u.alive&&u.side!==a.side;
  const notIn=(p,f)=>(u,picked)=>f(u)&&!picked.includes(u);
  if(a.isBoss){
    const id=a.bossId;
    if(id===1){
      add('技1','敵1体に3ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],dm(a,3));});
      add('技2','指定1人に2ダメージ、その両隣に1ダメージ',[P('指定する人',foe)],async([t])=>{
        await applyEvents([{src:a,to:t,amt:dm(a,2)},...neighbors(t).map(n=>({src:a,to:n,amt:dm(a,1)}))]);});
    }else if(id===2){
      if(a.form===0){
        add('技1','2人に1ダメージ。その2人は次のターン休み',[P('1人目',foe),P('2人目',notIn(0,foe))],async([x,y])=>{
          await dmgTo(a,[x,y],1);setRest(x);setRest(y);});
        add('技2','1人に3ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],3);});
      }else if(a.form===1){
        add('技1','自分を2回復',[],async()=>{heal(a,2);});
        add('技2','敵に1ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],1);});
      }else{
        add('技1','1人に2ダメージ',[P('対象',foe)],async([t])=>{await dmgTo(a,[t],2);});
      }
    }else if(id===3){
      add('技1','2人に1ダメージ。その後、与えたダメージ分回復',[P('1人目',foe),P('2人目',notIn(0,foe))],async([x,y])=>{
        const d=await dmgTo(a,[x,y],1);if(d>0)heal(a,d);});
      const pc=G.units.find(u=>u.id===G.prevCorrect);
      add('技2',`直前に正解した相手に4ダメージ${pc?`（${pc.name}）`:'（該当者なし）'}`,[],async()=>{
        const t=G.units.find(u=>u.id===G.prevCorrect);
        if(t&&t.alive&&t.side!==a.side)await dmgTo(a,[t],4);else log('直前の正解者がいないため不発');},
        {disabled:!(pc&&pc.alive&&pc.side!==a.side)});
    }else{
      add('通常ボタンで正解','敵全体に1ダメージ',[],async()=>{await dmgTo(a,foesOf(a),1);});
      add('ディレイボタンで正解','1人を倒す',[P('倒す相手',foe)],async([t])=>{await dmgTo(a,[t],9999);});
    }
    return L;
  }
  // ---- プレイヤー職 ----
  if(a.job==='mw'){
    add(`通常攻撃（敵全体に${dm(a,a.atk)}）`,'常に敵全体へ',[],async()=>{await dmgTo(a,foesOf(a),dm(a,a.atk));});
  }else if(!['sage','monk','warrior','mage','bm','hero','necro'].includes(a.job)||true){
    add(`通常攻撃（${dm(a,a.atk)}）`,'1人に攻撃（自分・味方も可）',[P('攻撃対象',alive)],async([t])=>{await dmgTo(a,[t],dm(a,a.atk));});
  }
  switch(a.job){
    case 'sage': add('蘇生','死んだプレイヤーを体力1で蘇生',[P('蘇生する人',u=>!u.alive&&!u.isBoss&&u.side===a.side)],async([t])=>{
      t.alive=true;t.hp=1;log(`${t.name} が体力1で蘇生した！`,'heal');});break;
    case 'monk': add('回復','1人を3回復',[P('回復する人',alive)],async([t])=>{heal(t,3);});break;
    case 'warrior': add('捨て身の一撃','自身と他1人に5ダメージ',[P('もう1人の対象',u=>u.alive&&u!==a)],async([t])=>{
      await applyEvents([{src:a,to:a,amt:dm(a,5)},{src:a,to:t,amt:dm(a,5)}]);});break;
    case 'mage': add('封じの魔法','1人に1ダメージ＋次の問題休み',[P('対象',alive)],async([t])=>{
      await dmgTo(a,[t],dm(a,1));setRest(t);});break;
    case 'bm': add('必殺の一撃','1人に8ダメージ（バトル中1度だけ）',[P('対象',alive)],async([t])=>{
      a.used=true;await dmgTo(a,[t],dm(a,8));},{disabled:a.used});break;
    case 'hero': add('勇者の剣','自身を3回復し、他1人に4ダメージ',[P('対象',u=>u.alive&&u!==a)],async([t])=>{
      heal(a,3);await dmgTo(a,[t],dm(a,4));});break;
    case 'necro': {
      const n=G.units.filter(u=>!u.alive&&!u.isBoss&&u.side===a.side).length;
      add(`死者の怨念（${n}ダメージ）`,'死んでいる仲間の人数×1ダメージ',[P('対象',alive)],async([t])=>{
        if(n>0)await dmgTo(a,[t],dm(a,n));else log('死んでいる仲間がいない');});break;}
  }
  return L;
}

/* =====================================================================
   モーダル
   ===================================================================== */
function ask(title,opts,{sub='',cancel=true}={}){
  return new Promise((res,rej)=>{
    const m=$('#modal');
    m.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3>${sub?`<p class="sub">${esc(sub)}</p>`:''}<div class="opts">${
      opts.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}" ${o.disabled?'disabled':''}><b>${i+1}. ${esc(o.label)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</button>`).join('')
    }</div>${cancel?'<button class="cancel" data-c="1">キャンセル（この問題の処理を取り消す）</button>':''}</div>`;
    m.classList.add('on');
    m.onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      m.classList.remove('on');m.onclick=null;
      if(b.dataset.c)rej(CANCEL);else res(opts[+b.dataset.i].value);
    };
  });
}
async function pickUnit(label,f,picked){
  const c=G.units.filter(u=>f(u,picked));
  if(!c.length)return null;
  const id=await ask(label,c.map(u=>({label:u.name,sub:`${jobName(u)}　HP ${u.hp}/${u.maxHp}${u.alive?'':'（死亡）'}${u.side==='e'?'　【魔王側】':''}`,value:u.id,cls:u.side==='e'?'foe':''})));
  return G.units.find(u=>u.id===id);
}
async function runAction(act){
  const picked=[];
  for(const p of act.prompts){
    const t=await pickUnit(p.label,p.f,picked);
    if(!t){log('対象がいないため不発');return;}
    picked.push(t);
  }
  await act.run(picked);
}

/* =====================================================================
   進行
   ===================================================================== */
function checkEnd(){
  if(G.over)return;
  if(G.mode==='pvp'){
    const p=G.units.some(u=>u.alive&&u.side==='p'),e=G.units.some(u=>u.alive&&u.side==='e');
    if(!p||!e)G.over=p?'teamp':e?'teame':'draw';
    return;
  }
  if(G.units.filter(u=>u.isBoss).every(b=>!b.alive))G.over='win';
  else if(!G.units.some(u=>u.alive&&u.side==='p'))G.over='lose';
}
function endQuestion(correct){
  for(const u of G.units){u.restNow=u.restNext;u.restNext=false;}
  G.prevCorrect=correct?correct.id:null;
  if(!correct)G.streak=0;
  G.q++; G.sel=null;
  log(`── 第${G.q}問 ──`,'sys');
  checkEnd();
}

async function doCorrect(a){
  log(`⭕ ${nm(a)} 正解！`,'sys');
  G.streak=(G.prevCorrect===a.id)?(G.streak||1)+1:1;
  if(a.job==='tank'){a.guards++;log(`🛡 ${a.name} の守り回数 +1 (${a.guards})`,'sys');}
  if(a.job==='playboy'&&G.streak>=2){
    const h=JOB.hero;a.job='hero';a.atk=h.atk;a.maxHp=h.hp;a.hp=h.hp;
    log(`🎲→👑 ${a.name} は連答で勇者に転職！体力リセット (HP ${a.hp})`,'sys');
  }
  if(a.isBoss&&a.bossId===3&&a.hp===1)heal(a,5);
  const acts=actionsFor(a);
  const noSpecial=acts.every(x=>x.disabled);
  const c=await ask(`${nm(a)} の行動`,[
    ...acts.map((x,i)=>({label:x.label,sub:x.desc,value:i,disabled:x.disabled||!x.prompts.every(p=>G.units.some(u=>p.f(u,[])))})),
    {label:'何もしない',value:-1,cls:'ghost'}],{sub:noSpecial?'使える行動がありません':''});
  if(c>=0)await runAction(acts[c]);
  if(a.job==='thief'&&a.alive&&!G.over){
    const g=await ask('💰 盗賊：次の問題のジャンルを選択',[...GENRES.map(x=>({label:x,value:x})),{label:'選ばない',value:null,cls:'ghost'}]);
    if(g){G.genre=g;G.genreFor=G.q+1;log(`次の問題のジャンル：${g}`,'sys');}
  }
  endQuestion(a);
}
async function doWrong(a){
  log(`❌ ${nm(a)} 誤答`,'sys');
  if(a.isBoss&&!G.cfg.bossPenalty)log('魔王は誤答ペナルティなし');
  else await applyEvents([{src:null,to:a,amt:2}]);
  endQuestion(null);
}
async function doThrow(){
  log('誰も答えず（スルー）','sys');
  for(const b of G.units) if(b.isBoss&&b.alive&&b.bossId===2&&b.form===2)heal(b,1);
  endQuestion(null);
}

/* ---------- トランザクション（取り消し対応） ---------- */
async function transact(fn){
  if(busy||!G||G.over)return;
  busy=true;
  const snap=JSON.stringify(G);
  try{
    await fn();
    undoStack.push(snap); if(undoStack.length>40)undoStack.shift();
    save();
  }catch(e){
    if(e===CANCEL){G=JSON.parse(snap);}
    else{console.error(e);G=JSON.parse(snap);toast('エラーが発生したため処理を取り消しました: '+e.message,4000);}
  }finally{busy=false;render();}
}
function undo(){
  if(busy||!undoStack.length)return;
  G=JSON.parse(undoStack.pop());G.over=null;save();render();
}

/* ---------- 保存 ---------- */
function save(){try{localStorage.setItem('quizrpg_save',JSON.stringify(G));}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem('quizrpg_save'));}catch(e){return null;}}

   ===================================================================== */
function card(u){
  const pct=Math.max(0,u.hp/u.maxHp*100);
  const bc=pct<=25?'crit':pct<=50?'low':'';
  const tags=[];
  if(u.restNow)tags.push('<span class="tag warn">💤 今回休み</span>');
  if(u.restNext)tags.push('<span class="tag">次は休み</span>');
  if(u.job==='tank')tags.push(`<span class="tag warn">🛡 守り×${u.guards}</span>`);
  if(u.job==='bm')tags.push(`<span class="tag">${u.used?'技使用済':'技未使用'}</span>`);
  if(JOB[u.job]&&JOB[u.job].tag&&u.job!=='tank')tags.push(`<span class="tag">${esc(JOB[u.job].tag)}</span>`);
  if(u.converted)tags.push('<span class="tag warn">魔王軍に寝返り</span>');
  if(u.isBoss&&u.bossId===1&&bonus(u))tags.push('<span class="tag warn">与ダメ+2</span>');
  if(u.isBoss&&u.bossId===4)tags.push('<span class="tag">通常/ディレイ</span>');
  const prev=lastHp[u.id]; let anim='';
  if(prev!==undefined){if(u.hp<prev)anim='hit';else if(u.hp>prev)anim='heal';}
  const can=u.alive&&!u.restNow&&!G.over;
  const sel=G.sel===u.id;
  return `<button class="unit ${u.side==='e'?'foe':'ally'} ${can?'can':''} ${sel?'sel':''} ${u.alive?'':'dead'} ${anim}" data-id="${u.id}" ${can?'':'tabindex="-1"'}>
    ${sel?'<div class="ribbon">回答中</div>':''}
    <div class="u-in"><div class="ic-wrap">${qkIcon(u.isBoss?'boss':u.job)}</div><div class="nm">${esc(u.name)}</div>
    <div class="jb">${esc(jobName(u))}${u.isBoss?'':` ／ ATK ${u.atk}`}</div>
    <div class="bar ${bc}" style="margin-top:8px"><i style="width:${pct}%"></i></div>
    <div class="hp">HP <b>${Math.max(0,u.hp)}</b> / ${u.maxHp}${u.alive?'':' 💀'}</div>
    <div class="tags">${tags.join('')}</div></div></button>`;
}

  $('#startBtn').textContent=hint?'バトル開始':`バトル開始（${named.length}人）`;
  $('#startHint').textContent=hint||(pvp?`チームA ${nA}人 vs チームB ${nB}人`:`${BOSS[setup.boss].n} に挑みます`);
  $('#bosslist').innerHTML=Object.keys(BOSS).map(id=>`<button class="bopt ${setup.boss==id?'sel':''}" data-boss="${id}"><span class="bi">${qkIcon('boss')}</span><span><b>${BOSS[id].n}</b><small>${esc(BOSS[id].d)}</small></span></button>`).join('');
  $('#contBtn').classList.toggle('hide',!loadSave());
}
function syncRoster(){
  const ids=new Set(net.lobby.map(p=>p.pid));
  const vj=j=>SELECTABLE.includes(j)?j:'warrior';
  setup.players=setup.players.filter(p=>!p.pid||ids.has(p.pid));
  for(const lp of net.lobby){
    const row=setup.players.find(p=>p.pid===lp.pid);
    if(!row)setup.players.push({name:lp.name,flavor:lp.flavor||'',job:vj(lp.job),team:lp.team||'p',pid:lp.pid,online:lp.online});
    else{row.online=lp.online;row.flavor=lp.flavor||'';if(!row.touchedJob)row.job=vj(lp.job);if(!row.touchedTeam)row.team=lp.team||row.team;}
  }
}

/* =====================================================================
   ルール表示
   ===================================================================== */
function showRules(){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox"><h3>職業・ルール一覧</h3>
  <p class="sub">共通ルール：①正解時に通常攻撃または能力を発動 ②誤答は役職に関係なく2ダメージ ③休みは連続にならない ④自分や自チームも攻撃可能 ⑤勇者転職時は体力リセット ⑥タンクは死んでも守り回数を継続 ⑦タンクは範囲攻撃で自分が死ぬ場合も庇える</p>
  <table class="rules">${Object.entries(JOB).map(([k,j])=>`<tr><th>${qkIcon(k)} ${j.n}</th><td>ATK${j.atk}/HP${j.hp}<br>${esc(j.d)}</td></tr>`).join('')}
  ${Object.entries(BOSS).map(([k,b])=>`<tr><th>${qkIcon('boss')} ${b.n}</th><td>${esc(b.d)}</td></tr>`).join('')}</table>
  <button class="cancel" data-c="1">閉じる</button></div>`;
  m.classList.add('on');
  m.onclick=e=>{if(e.target.closest('button')||e.target===m){m.classList.remove('on');m.onclick=null;}};
}

/* =====================================================================
   イベント
   ===================================================================== */
function startGame(){
  const ps=setup.players.filter(p=>p.name.trim());
  if(!ps.length){toast('プレイヤーを追加してください');return;}
  const pvp=setup.mode==='pvp';
  if(pvp&&(!ps.some(p=>p.team==='p')||!ps.some(p=>p.team==='e'))){toast('両チームに1人以上必要です');return;}
  G={mode:setup.mode,uid:1,units:[],log:[],q:1,prevCorrect:null,streak:0,genre:null,genreFor:0,sel:null,over:null,
     cfg:{bossPenalty:$('#optPen').checked}};
  G.pids={};
  ps.forEach(p=>{const u=mkUnit(p.name.trim(),p.job);if(pvp)u.side=p.team;G.units.push(u);if(p.pid)G.pids[p.pid]=u.id;});
  if(pvp){
    G.units.sort((a,b)=>(a.side==='p'?0:1)-(b.side==='p'?0:1)); // チームごとに席順を連続させる
    log('対戦開始！ チームA vs チームB','sys');
  }else{
    const S=G.units.reduce((s,u)=>s+u.atk,0);
    G.units.push(mkBoss(+setup.boss,S));
    const b=G.units[G.units.length-1];
    log(`バトル開始！ ${b.name} (HP ${b.hp}) ／ プレイヤー攻撃合計 ${S}`,'sys');
  }
  log('── 第1問 ──','sys');
  undoStack=[];lastHp={};save();render();
}
$('#addP').onclick=()=>{setup.players.push({name:`ゲスト${setup.players.filter(p=>!p.pid).length+1}`,job:'warrior',team:setup.players.length%2?'e':'p',touchedJob:true,touchedTeam:true});renderSetup();};
$('#plist').addEventListener('input',e=>{const t=e.target,row=t.closest('.rrow');if(row&&t.dataset.k==='name'){setup.players[+row.dataset.i].name=t.value;renderSetup();}});
$('#plist').addEventListener('change',e=>{const t=e.target,row=t.closest('.rrow');if(!row||t.dataset.k!=='job')return;const p=setup.players[+row.dataset.i];p.job=t.value;p.touchedJob=true;t.blur();renderSetup();});
$('#plist').addEventListener('click',e=>{
  const row=e.target.closest('.rrow');if(!row)return;
  const i=+row.dataset.i,p=setup.players[i];
  const tb=e.target.closest('[data-team]');if(tb){p.team=tb.dataset.team;p.touchedTeam=true;renderSetup();return;}
  if(e.target.closest('[data-del]')){if(p.pid)netSend({t:'kick',pid:p.pid});setup.players.splice(i,1);renderSetup();}
});
$('#bosslist').addEventListener('click',e=>{const b=e.target.closest('[data-boss]');if(b){setup.boss=b.dataset.boss;renderSetup();}});
$('#modeCpu').onclick=()=>{setup.mode='cpu';renderSetup();};
$('#modePvp').onclick=()=>{setup.mode='pvp';renderSetup();};
$('#startBtn').onclick=startGame;
$('#contBtn').onclick=()=>{const s=loadSave();if(s){G=s;undoStack=[];render();}};
$('#rulesBtn1').onclick=$('#rulesBtn2').onclick=showRules;
$('#undoBtn').onclick=undo;
$('#quitBtn').onclick=()=>{if(confirm('最初の設定画面に戻りますか？（進行中のバトルは破棄されます）')){G=null;net.openedFor=null;netSend({t:'endgame'});render();}};
$('#overBtn').onclick=()=>{G=null;net.openedFor=null;netSend({t:'endgame'});render();};
$('#game').addEventListener('click',e=>{
  if(busy||!G||G.over)return;
  const card=e.target.closest('.unit');
  if(card){const u=G.units.find(x=>x.id==card.dataset.id);if(u&&u.alive&&!u.restNow){G.sel=G.sel===u.id?null:u.id;if(G.sel!=null)netSend({t:'lock'});else openBuzz(true);render();}return;}
  const bb=e.target.closest('button');const id=bb?bb.id:'';
  if(id==='bThrow')transact(doThrow);
  else if(id==='bRe'){G.sel=null;openBuzz(true);render();}
  else if(id==='bReopen'){openBuzz(true);}
  else if(id==='bOk'){const a=G.units.find(x=>x.id===G.sel);transact(()=>doCorrect(a));}
  else if(id==='bNg'){const a=G.units.find(x=>x.id===G.sel);transact(()=>doWrong(a));}
});

/* =====================================================================
   オンライン連携（server.js と通信）
   ===================================================================== */
const net={on:false,ws:null,room:null,lobby:[],openedFor:null,rank:''};
function netSend(m){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(m));}
const ROOM=new URLSearchParams(location.search).get('id');
function toast(msg,ms=2500){const d=document.createElement('div');d.className='t';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms);}
let actx=null,soundOn=true;try{soundOn=localStorage.getItem('qr_sound_host')!=='0';}catch(e){}
function tone(f,d,type,vol,when){if(!soundOn)return;try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
function beep(){tone(880,.12,'triangle',.18);tone(1175,.18,'triangle',.15,.1);}
function setSound(on){soundOn=on;try{localStorage.setItem('qr_sound_host',on?'1':'0');}catch(e){}$('#sndBtn').textContent=on?'🔊 効果音：オン':'🔇 効果音：オフ';}
$('#sndBtn').onclick=()=>setSound(!soundOn);setSound(soundOn);
async function copyJoinUrl(){const u=`${location.origin}/play?id=${ROOM}`;try{await navigator.clipboard.writeText(u);toast('参加用URLをコピーしました');}catch(e){toast(u,6000);}}
$('#copyUrl').onclick=$('#copyUrl2').onclick=$('#roomChip').onclick=copyJoinUrl;
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.metaKey||e.altKey)return;
  const m=$('#modal');
  if(m.classList.contains('on')){
    if(e.key==='Escape'){const c=m.querySelector('.cancel');if(c)c.click();return;}
    const opts=[...m.querySelectorAll('.opt')],n=parseInt(e.key);
    if(n>=1&&opts[n-1]&&!opts[n-1].disabled){e.preventDefault();opts[n-1].click();}
    return;
  }
  if(!G||G.over||busy)return;
  const k=e.key.toLowerCase();
  if(e.ctrlKey&&k==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey)return;
  if(k==='o')$('#bOk')&&$('#bOk').click();
  else if(k==='x')$('#bNg')&&$('#bNg').click();
  else if(k==='s')$('#bThrow')&&$('#bThrow').click();
  else if(k==='r')($('#bReopen')||$('#bRe'))&&($('#bReopen')||$('#bRe')).click();
});
function leaveToList(){location.href='/';}
function netConnect(){
  if(!ROOM){leaveToList();return;}
  const ws=net.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?id='+ROOM);
  ws.onopen=()=>{
    const k=localStorage.getItem('qr_hk_'+ROOM);
    if(!k){leaveToList();return;}
    netSend({t:'host_resume',id:ROOM,hostKey:k});
  };
  ws.onclose=()=>{if(net.on&&!net.closing)setTimeout(netConnect,1500);};
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.t==='created'){net.on=true;net.room=m.room;net.roomName=m.name;net.openedFor=null;renderSetupOnline();if(G)render();}
    else if(m.t==='error'){localStorage.removeItem('qr_hk_'+ROOM);toast(m.msg,3000);net.on=false;net.closing=true;setTimeout(leaveToList,1500);}
    else if(m.t==='lobby'){
      for(const p of (net.lobbyInit?m.players:[])){const o=net.lobby.find(x=>x.pid===p.pid);
        if(!o)toast(`${p.name} が入室しました`);else if(!o.online&&p.online)toast(`${p.name} が再接続しました`);else if(o.online&&!p.online)toast(`${p.name} の接続が切れました`);}
      net.lobby=m.players;net.lobbyInit=true;syncRoster();renderSetupOnline();if(G)render();}
    else if(m.t==='winner'){
      beep(m);net.rank=m.ranking.map((x,i)=>`${i+1}. ${x.name}${i?` (+${Math.round(x.ms)}ms)`:''}`).join('　');
      if(G&&!busy&&!G.over&&G.sel==null&&G.pids&&G.pids[m.pid]!=null){
        const u=G.units.find(x=>x.id===G.pids[m.pid]);
        if(u&&u.alive&&!u.restNow)G.sel=u.id;
      }
      if(G)render();
    }
  };
}
function closeRoomNow(){
  if(!confirm('部屋を閉じますか？参加者は全員退室になります。'))return;
  net.closing=true;netSend({t:'close'});localStorage.removeItem('qr_hk_'+ROOM);setTimeout(leaveToList,200);
}
function updateRoomInfo(){
  const el=$('#roomInfo');if(!el)return;
  el.textContent=net.on?`${net.room}番「${net.roomName}」 ・ ${net.lobby.filter(p=>p.online).length}人`:'接続中…';
}
function renderSetupOnline(){
  updateRoomInfo();
  if(!net.on)return;
  $('#onNum').textContent=net.room;$('#onName').textContent=net.roomName;
  $('#onUrl').value=`${location.origin}/play?id=${net.room}`;
  renderSetup();
}
function openBuzz(force){
  if(!net.on||!G||G.over)return;
  if(!force&&net.openedFor===G.q)return;
  net.openedFor=G.q;net.rank='';
  const eligible={};
  for(const [pid,uid] of Object.entries(G.pids||{})){
    const u=G.units.find(x=>x.id===uid);
    if(u&&u.alive&&!u.restNow)eligible[pid]=u.job==='berserker'?700:0; // バーサーカーは常にディレイ
  }
  netSend({t:'open',q:G.q,eligible});
}
function publish(){
  if(!net.on||!G)return;
  netSend({t:'state',state:{mode:G.mode,q:G.q,over:G.over,pids:G.pids,sel:G.sel,
    genre:(G.genre&&G.genreFor===G.q)?`ジャンル：${G.genre}`:'',
    units:G.units.map(u=>({id:u.id,name:u.name,job:u.job,jobName:jobName(u),side:u.side,hp:u.hp,maxHp:u.maxHp,alive:u.alive,restNow:u.restNow,guards:u.guards})),
    log:G.log.slice(0,12).map(l=>l.m)}});
  if(G.sel==null&&!G.over)openBuzz(false);
}
$('#closeRoom1').onclick=$('#closeRoom2').onclick=closeRoomNow;
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('hide');};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.add('hide');});
for(const id of ['rulesBtn2','copyUrl','sndBtn','quitBtn','closeRoom2'])$('#'+id).addEventListener('click',()=>$('#menu').classList.add('hide'));
netConnect();
render();
</script>
