<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14110e">
<title>QUIZ KNIGHTS - 部屋</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/icons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
:root{--rubric:#7a1f26}
body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
input{-webkit-user-select:text;user-select:text}
#conn{position:fixed;left:0;right:0;top:0;z-index:90;background:var(--red-d);text-align:center;padding:5px;font-size:.85rem}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
#flash.d{background:radial-gradient(circle,#0000 40%,#ff2030aa);animation:fo .5s}
#flash.h{background:radial-gradient(circle,#0000 40%,#40ff80aa);animation:fo .6s}
@keyframes fo{from{opacity:1}to{opacity:0}}

/* 入室 */
.card-join{max-width:440px;margin:6vh auto 0}
.card-join h2{font-size:1.4rem;color:var(--gold);text-align:center}
.card-join .roomlabel{text-align:center;color:var(--mut);margin:4px 0 6px}
.err{color:#ff9aa2;font-size:.86rem;min-height:1.3em;margin-top:8px}
.joinrow{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}

/* ロビー */
.lobby-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lobby-h .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:#120f0c;border:2px solid var(--gold);color:var(--gold)}
.lobby-h h2{font-size:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip.off{opacity:.45}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.job{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.1s}
.job:hover{border-color:var(--line2)}
.job.sel{background:#3a2f1a;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.job .e{font-size:1.6rem;flex:none}.job b{display:block;font-size:.92rem}.job small{color:var(--mut)}
#jobDesc{min-height:2.8em;color:var(--mut);font-size:.88rem;margin:4px 0 10px;padding:8px 10px;border-left:3px solid var(--gold);background:#0003;border-radius:0 8px 8px 0}
.team-seg{display:flex;width:100%;margin:6px 0 14px}.team-seg button{flex:1}
.team-seg .seg button.sel{background:var(--gold)}

/* ゲーム */
#game{display:flex;flex-direction:column;min-height:calc(100dvh - 24px);gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--line)}
.qn{font-family:var(--serif);font-size:1.5rem;font-weight:800;color:var(--gold)}
.top .net{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.8rem;margin-right:48px}
#me{display:flex;gap:14px;align-items:center;padding:12px 14px}
#me .em{font-size:2rem;width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--blu);border-radius:50%;background:radial-gradient(circle,#3b2f21,#17120d);flex:none}
#me .nm{font-weight:800;font-size:1.1rem}
#me .bar{margin:6px 0}
#me .st{font-size:.9rem;font-variant-numeric:tabular-nums}
#banner{text-align:center;padding:12px;border:1px solid var(--line);background:var(--s1);border-radius:12px;transition:.2s}
#banner b{font-size:1.15rem;display:block}
#banner.open{background:#4a1519;border-color:var(--red);animation:pulse 1s infinite}
#banner.win{background:linear-gradient(180deg,#f0c964,var(--gold-d));color:#2a1c06;border-color:#fff3c0}
#banner.other{background:#1f3350;border-color:var(--blu)}
@keyframes pulse{50%{box-shadow:0 0 20px #e5545f88}}
#rank{font-size:.8rem;margin-top:4px;opacity:.9}
#mid{flex:1;min-width:0}
.strip{display:flex;gap:12px;overflow-x:auto;padding:10px 4px 12px;scroll-snap-type:x proximity}
.strip .unit{flex:0 0 138px;scroll-snap-align:start}
.strip .unit .u-in{padding:12px 8px 22px}
.strip .nm{font-size:.92rem}
details#logBox{border-radius:12px;padding:10px 14px;box-shadow:inset 0 0 30px #8a6a3566;margin-bottom:8px}
details#logBox summary{cursor:pointer;color:var(--rubric);font-weight:800;letter-spacing:.3em;text-align:center;font-family:var(--serif)}
#log p{margin:6px 0 0;font-size:.82rem;border-bottom:1px dotted #8a6a3577;padding-bottom:3px}
#buzzArea{position:sticky;bottom:0;padding:14px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0000,var(--bg) 30%)}
#buzz{display:block;margin:0 auto;width:min(66vw,250px);aspect-ratio:1;border-radius:50%;font-size:2rem;font-weight:900;letter-spacing:.1em;border:6px double var(--line2);cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#555,#2a2a2a);color:#999;touch-action:manipulation;transition:transform .05s}
#buzz.on{background:radial-gradient(circle at 35% 30%,#f0626c,#a92b36 70%,#6a1119);color:#fff;border-color:var(--gold);text-shadow:0 2px 0 #0008;box-shadow:0 0 40px #e5545faa,inset 0 0 20px #0009}
#buzz.on:active,#buzz.sent{transform:scale(.94)}
#buzz.sent{background:radial-gradient(circle at 35% 30%,#7ad493,var(--grn-d));color:#fff;border-color:#c8e8b0}
#tools{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:50}
#tools button{width:38px;height:38px;border-radius:50%;background:#000a;border:1px solid var(--line2);font-size:1rem;line-height:1;padding:0;cursor:pointer}
#over{position:fixed;inset:0;background:#000d;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center}
#over.on{display:flex}#over h2{font-size:2.6rem}

/* PC: 左に自分とボタン、右に全員と年代記 */
@media(min-width:900px){
  .wrap{max-width:1060px;padding:20px 24px}
  #game{display:grid;grid-template-columns:380px 1fr;grid-template-areas:"top top" "me mid" "banner mid" "buzz mid";gap:14px 28px;align-items:start;min-height:0}
  .top{grid-area:top}#me{grid-area:me}#banner{grid-area:banner}#mid{grid-area:mid}
  #buzzArea{grid-area:buzz;position:static;background:none;padding:6px 0}
  #buzz{width:280px}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible;gap:16px;padding:4px 0 14px}
  .strip .unit{flex:none}
  details#logBox[open] #log{max-height:40vh;overflow:auto}
  .card-join{margin-top:10vh}
}
</style>
</head>
<body>
<div id="conn" class="hide">接続が切れました。再接続しています…</div>
<div id="toast"></div>
<div id="flash"></div>

<div class="wrap">
  <!-- 入室 -->
  <div id="join" class="panel card-join">
    <h2>部屋に参加</h2>
    <div class="roomlabel" id="roomLabel">読み込み中…</div>
    <label class="field"><span>あなたの名前</span><input class="input" id="name" maxlength="12" autocomplete="nickname" enterkeyhint="go"></label>
    <label class="field"><span>ひとこと（任意）</span><input class="input" id="flavor" maxlength="20" placeholder="例：本日の意気込み"></label>
    <div id="pwBox" class="hide"><label class="field"><span>パスワード</span><input class="input" id="pw" maxlength="20" type="password" autocomplete="off"></label></div>
    <div class="err" id="err"></div>
    <div class="joinrow"><a href="/">← 部屋一覧に戻る</a><button class="btn primary lg" id="joinBtn">参加する</button></div>
  </div>

  <!-- ロビー -->
  <div id="lobby" class="panel hide" style="max-width:640px;margin:0 auto">
    <div class="lobby-h"><div class="num" id="roomNum"></div><div><h2 id="roomName"></h2><div class="sub" id="who"></div></div></div>
    <div class="chips" id="members"></div>
    <div class="sub">① 職業を選んでください</div>
    <div class="jobs" id="jobs"></div>
    <div id="jobDesc"></div>
    <div class="sub">② チーム（ユーザー対戦のときだけ使われます）</div>
    <div class="team-seg"><div class="seg" id="team" style="width:100%"><button data-t="p" style="flex:1">チームA</button><button data-t="e" style="flex:1">チームB</button></div></div>
    <div class="sub" style="text-align:center;margin-bottom:12px">進行役がバトルを開始すると、自動で画面が切り替わります</div>
    <div style="display:flex;gap:10px"><button class="btn ghost" id="renameBtn" style="flex:1">名前を変える</button><button class="btn ghost danger" id="leaveBtn" style="flex:1">退室する</button></div>
  </div>

  <!-- ゲーム -->
  <div id="game" class="hide">
    <div class="top"><div><span class="qn" id="q"></span> <span class="chip pur hide" id="genre"></span></div><div class="net"><span class="dot" id="dot"></span><span id="ping"></span></div></div>
    <div id="me" class="panel"></div>
    <div id="banner"><b id="bt"></b><div id="rank"></div></div>
    <div id="mid">
      <div class="strip" id="cards"></div>
      <details id="logBox" class="parch"><summary>年代記</summary><div id="log"></div></details>
    </div>
    <div id="buzzArea"><button id="buzz" disabled>待機中</button></div>
  </div>
</div>
<div id="tools" class="hide"><button id="sndBtn" aria-label="効果音">🔊</button></div>
<div id="over"><h2 id="overT"></h2><div class="sub" id="overS"></div></div>

<script>
/* 職業: [名前, 絵文字, ATK, HP, 説明] */
const JOBS={
 sage:['賢者','📿',1,5,'通常攻撃の代わりに、死んだ味方を体力1で蘇生できる'],
 monk:['僧侶','🙏',1,6,'通常攻撃の代わりに、1人を3回復できる'],
 warrior:['戦士','🗡',3,7,'通常攻撃の代わりに、自分と他1人に5ダメージ'],
 mage:['魔法使い','🔮',3,5,'1人に1ダメージを与え、そのプレイヤーは次の問題休み'],
 bm:['バトルマスター','⚔',5,2,'1戦に1度だけ、1人に8ダメージ'],
 tank:['タンク','🛡',1,10,'仲間への攻撃を代わりに受けられる。正解するたびに回数+1'],
 berserker:['バーサーカー','🪓',7,7,'常にボタンにディレイがつく（押しても0.7秒遅れる）'],
 mw:['魔法戦士','✨',2,5,'通常攻撃が常に敵全体への攻撃になる'],
 thief:['盗賊','💰',2,4,'正解したら次の問題のジャンルを選べる'],
 playboy:['遊び人','🎲',0,3,'連続で正解すると「勇者」に転職する'],
 bomb:['ばくだんいわ','💣',1,5,'倒れると両隣に3ダメージを与える'],
 necro:['ネクロマンサー','💀',1,5,'死んだ仲間の人数×1ダメージを与える'],
 hero:['勇者','👑',7,7,'自身を3回復し、他の1人に4ダメージ'],
 boss:['魔王','👹',0,0,'']};
const SEL=['sage','monk','warrior','mage','bm','tank','berserker','mw','thief','playboy','bomb','necro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROOM=new URLSearchParams(location.search).get('id');
const PIDKEY='qr_pid_'+ROOM;
const toList=()=>{location.href='/';};
if(!ROOM)toList();
const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- 通知・音・振動 ---------- */
function toast(msg,ms=2500){const d=document.createElement('div');d.className='t';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms);}
let actx=null,soundOn=store.get('qr_sound')!=='0';
function unlock(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function tone(f,d=.12,type='sine',vol=.15,when=0){
  if(!soundOn||!actx)return;const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}
const SFX={open:()=>tone(660,.18),press:()=>tone(240,.07,'square',.1),
  win:()=>{tone(523,.12,'triangle');tone(659,.12,'triangle',.15,.1);tone(784,.3,'triangle',.15,.2);},
  other:()=>tone(330,.15,'sine',.08),hit:()=>{tone(120,.2,'square',.14);},heal:()=>{tone(784,.1);tone(988,.18,'sine',.12,.08);}};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
function setSound(on){soundOn=on;store.set('qr_sound',on?'1':'0');$('#sndBtn').textContent=on?'🔊':'🔇';}
$('#sndBtn').onclick=()=>{unlock();setSound(!soundOn);};setSound(soundOn);
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state)keepAwake();});

/* ---------- 状態 ---------- */
let ws,pid=null,offset=0,bestRtt=1e9,open=false,eligible=[],sent=false,state=null,winner=null,leaving=false,prevHp={},myJob='warrior',myTeam='p',retry=0;
const now=()=>Date.now()+offset;
const send=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));};
const show=id=>{for(const x of ['#join','#lobby','#game'])$(x).classList.toggle('hide',x!==id);$('#tools').classList.toggle('hide',id!=='#game'&&id!=='#lobby');};

$('#name').value=store.get('qr_name')||'';
$('#flavor').value=store.get('qr_flavor')||'';

async function init(){
  let info=null;
  try{info=(await (await fetch('/api/rooms',{cache:'no-store'})).json()).find(r=>String(r.id)===ROOM);}catch(e){}
  if(!info||!info.used){toast('その部屋は存在しません');setTimeout(toList,1200);return;}
  $('#roomLabel').textContent=`${info.id}番「${info.name}」`;
  $('#roomName').textContent=info.name;
  $('#pwBox').classList.toggle('hide',!info.hasPw);
  const known=sessionStorage.getItem(PIDKEY);
  // 再接続、または名前が保存済みでパスワード不要なら、入力なしで自動入室
  if(known&&$('#name').value||(!info.hasPw&&$('#name').value&&!location.hash.includes('edit'))){connect();$('#roomLabel').textContent+='　入室中…';}
  else $('#name').focus();
}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?id='+ROOM);
  ws.onopen=()=>{
    retry=0;$('#conn').classList.add('hide');bestRtt=1e9;for(let i=0;i<8;i++)setTimeout(ping,i*120);
    send({t:'join',id:ROOM,name:$('#name').value.trim(),flavor:$('#flavor').value.trim(),password:$('#pw').value,pid:sessionStorage.getItem(PIDKEY)||undefined});
  };
  ws.onclose=()=>{if(leaving)return;$('#conn').classList.remove('hide');$('#dot').className='dot';setTimeout(connect,Math.min(5000,1000+retry++*800));};
  ws.onmessage=ev=>handle(JSON.parse(ev.data));
}
function ping(){send({t:'ping',c:Date.now()});}
setInterval(()=>{bestRtt=1e9;for(let i=0;i<4;i++)setTimeout(ping,i*150);},30000);

function handle(m){
  if(m.t==='pong'){const t1=Date.now(),rtt=t1-m.c;if(rtt<bestRtt){bestRtt=rtt;offset=m.s+rtt/2-t1;$('#ping').textContent=`${Math.round(rtt)}ms`;$('#dot').className='dot '+(rtt<150?'on':'warn');}}
  else if(m.t==='error'){
    if(m.code==='gone'){sessionStorage.removeItem(PIDKEY);toast(m.msg);leaving=true;setTimeout(toList,1200);}
    else{sessionStorage.removeItem(PIDKEY);pid=null;leaving=true;try{ws.close();}catch(e){}show('#join');$('#err').textContent=m.msg;if(m.code==='pw'){$('#pwBox').classList.remove('hide');$('#pw').focus();}}
  }
  else if(m.t==='joined'){
    pid=m.pid;leaving=false;sessionStorage.setItem(PIDKEY,pid);store.set('qr_name',m.name);store.set('qr_flavor',m.flavor||'');
    myJob=m.job;myTeam=m.team;$('#who').textContent=`${m.name} として参加中`;$('#roomName').textContent=m.roomName;$('#roomNum').textContent=m.room;drawLobby();
    show(state?'#game':'#lobby');keepAwake();render();
  }
  else if(m.t==='members'){$('#members').innerHTML=m.players.map(p=>`<span class="chip ${p.online?'':'off'}">${p.online?'●':'○'} ${esc(p.name)}${p.flavor?` 〈${esc(p.flavor)}〉`:''}</span>`).join('');}
  else if(m.t==='state'){const first=!state;state=m.state;show('#game');render();if(first)toast('バトル開始！');}
  else if(m.t==='ended'){state=null;open=false;winner=null;prevHp={};show('#lobby');$('#over').classList.remove('on');}
  else if(m.t==='open'){open=true;eligible=m.eligible;sent=false;winner=null;if(eligible.includes(pid)){SFX.open();vib(30);}render();}
  else if(m.t==='locked'){open=false;render();}
  else if(m.t==='ack'){sent=true;render();}
  else if(m.t==='winner'){open=false;winner=m;
    if(m.pid===pid){SFX.win();vib([120,60,200]);}else SFX.other();render();}
  else if(m.t==='closed'){leaving=true;sessionStorage.removeItem(PIDKEY);toast(m.why||'部屋が閉じられました',3500);setTimeout(toList,2200);}
}

/* ---------- 描画 ---------- */
function drawLobby(){
  $('#jobs').innerHTML=SEL.map(j=>{const d=JOBS[j];return `<button class="job ${j===myJob?'sel':''}" data-j="${j}"><span class="e">${qkIcon(j)}</span><span><b>${d[0]}</b><small>ATK${d[2]} / HP${d[3]}</small></span></button>`;}).join('');
  $('#jobDesc').textContent=(JOBS[myJob]||[])[4]||'';
  for(const b of $('#team').children)b.classList.toggle('sel',b.dataset.t===myTeam);
}
function hpClass(u){const r=u.hp/u.maxHp;return r<=.25?'crit':r<=.5?'low':'';}
function render(){
  if(!state)return;
  const mine=state.pids&&state.pids[pid];
  const me=state.units.find(u=>u.id===mine);
  $('#q').textContent=`第${state.q}問`;
  const g=$('#genre');g.textContent=state.genre||'';g.classList.toggle('hide',!state.genre);
  // 自分の状態
  if(me){
    const d=JOBS[me.job]||JOBS.boss;
    $('#me').innerHTML=`<div class="em">${qkIcon(JOBS[me.job]?me.job:'boss')}</div><div style="flex:1"><div class="nm">${esc(me.name)} <span class="sub">${esc(me.jobName||'')}</span></div>
      <div class="bar ${hpClass(me)}"><i style="width:${Math.max(0,me.hp/me.maxHp*100)}%"></i></div>
      <div>HP <b>${Math.max(0,me.hp)}</b> / ${me.maxHp}${me.restNow?'　💤今回は休み':''}${me.job==='tank'?`　🛡守り×${me.guards}`:''}${me.alive?'':'　💀戦闘不能'}</div></div>`;
  }else $('#me').innerHTML='<div class="sub">観戦中（進行役が席に割り当てるとプレイヤーになります）</div>';
  // ボタンとバナー
  $('#buzzArea').classList.toggle('hide',!me);
  const can=open&&eligible.includes(pid)&&!sent&&!state.over;
  const b=$('#buzz');
  b.disabled=!can;b.className=can?'on':(sent?'sent':'');
  b.textContent=can?'押す！':sent?'送信済み':(me&&!me.alive)?'戦闘不能':(me&&me.restNow)?'今回は休み':open?'待機中':'待機中';
  const bn=$('#banner'),bt=$('#bt'),rk=$('#rank');let cls='',txt='',rank='';
  if(state.over)txt='バトル終了';
  else if(winner&&winner.q===state.q){
    if(winner.pid===pid){cls='win';txt='🎉 回答権を獲得！答えてください';}else{cls='other';txt=`回答権：${winner.name}`;}
    rank=winner.ranking.slice(0,4).map((x,i)=>`${i+1}. ${esc(x.name)}${i?` (+${Math.round(x.ms)}ms)`:''}`).join('　');
  }else if(open&&eligible.includes(pid)){cls='open';txt='受付中！ 押せ！';}
  else if(open)txt='受付中（今回は押せません）';
  else txt='問題を待っています…';
  bn.className=cls;bt.textContent=txt;rk.innerHTML=rank;
  // 全員の盾
  $('#cards').innerHTML=state.units.map(u=>`<div class="unit ${u.side==='e'?'foe':'ally'} ${u.id===mine?'sel':''} ${u.alive?'':'dead'}" data-id="${u.id}">
    ${u.id===mine?'<div class="ribbon">あなた</div>':''}
    <div class="u-in"><div class="ic-wrap">${qkIcon(JOBS[u.job]?u.job:'boss')}</div><div class="nm">${esc(u.name)}</div><div class="jb">${esc(u.jobName||'')}</div>
    <div class="bar ${hpClass(u)}" style="margin-top:6px"><i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i></div>
    <div class="hp">HP <b>${Math.max(0,u.hp)}</b> / ${u.maxHp}${u.restNow?' 💤':''}${u.job==='tank'?' 🛡'+u.guards:''}</div></div></div>`).join('');
  $('#log').innerHTML=(state.log||[]).map(l=>`<p>${esc(l)}</p>`).join('');
  // HP増減の演出
  for(const u of state.units){
    const p=prevHp[u.id];
    if(p!==undefined&&p!==u.hp){
      const diff=u.hp-p,el=$(`#cards [data-id="${u.id}"]`);
      if(el){const f=document.createElement('div');f.className='float '+(diff<0?'d':'h');f.textContent=(diff>0?'+':'')+diff;el.appendChild(f);setTimeout(()=>f.remove(),1100);}
      if(u.id===mine){const fl=$('#flash');fl.className='';void fl.offsetWidth;fl.className=diff<0?'d':'h';if(diff<0){SFX.hit();vib(diff<-3?[80,40,120]:60);}else SFX.heal();}
    }
    prevHp[u.id]=u.hp;
  }
  // 決着
  const ov=$('#over');
  if(state.over){
    const T={win:'🎉 勝利！',lose:'💀 全滅…',teamp:'🏆 チームAの勝利！',teame:'🏆 チームBの勝利！',draw:'引き分け'};
    $('#overT').textContent=T[state.over]||'バトル終了';$('#overS').textContent='進行役の操作を待っています';ov.classList.add('on');
  }else ov.classList.remove('on');
}

/* ---------- 操作 ---------- */
function buzz(){
  if($('#buzz').disabled)return;
  unlock();SFX.press();vib(25);
  send({t:'buzz',ts:now()});
  // 通信を待たずに押した感触を返す
  sent=true;$('#buzz').className='sent';$('#buzz').textContent='送信中…';
}
$('#buzz').addEventListener('pointerdown',e=>{e.preventDefault();buzz();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&state){e.preventDefault();buzz();}});
document.addEventListener('pointerdown',unlock,{once:true});
$('#joinBtn').onclick=()=>{
  if(!$('#name').value.trim()){$('#err').textContent='名前を入力してください';$('#name').focus();return;}
  unlock();$('#err').textContent='';sessionStorage.removeItem(PIDKEY);leaving=false;connect();
};
$('#join').addEventListener('keydown',e=>{if(e.key==='Enter')$('#joinBtn').click();});
$('#jobs').addEventListener('click',e=>{const b=e.target.closest('.job');if(!b)return;myJob=b.dataset.j;drawLobby();send({t:'profile',job:myJob,team:myTeam});});
$('#team').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;myTeam=b.dataset.t;drawLobby();send({t:'profile',job:myJob,team:myTeam});});
$('#leaveBtn').onclick=()=>{leaving=true;send({t:'leave'});sessionStorage.removeItem(PIDKEY);toList();};
$('#renameBtn').onclick=()=>{leaving=true;send({t:'leave'});sessionStorage.removeItem(PIDKEY);try{ws.close();}catch(e){}pid=null;state=null;show('#join');$('#name').focus();$('#name').select();};
init();
</script>
</body>
