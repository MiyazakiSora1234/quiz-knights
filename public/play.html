<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17110c">
<title>QUIZ KNIGHTS - 部屋</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/icons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#17110c;--line:#8a6a35;--tx:#f1e4c3;--mut:#b9a57f;--acc:#e0b650;--red:#a8262f;--grn:#5e8a45;--ink:#3a2a14;--rubric:#7a1f26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--tx);font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;-webkit-user-select:none;user-select:none;min-height:100dvh;
  background:radial-gradient(ellipse at 50% -10%,#3b2a1b 0,#17110c 65%) fixed;background-color:var(--bg);overscroll-behavior:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
input,button{font:inherit;color:inherit}
.hide{display:none!important}
.sub{color:var(--mut);font-size:.85rem}
h2{margin:0 0 8px;font-family:"Cinzel","Shippori Mincho",serif;color:var(--acc);letter-spacing:.06em}
.panel{background:linear-gradient(180deg,#32261c,#261c14);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px;box-shadow:inset 0 0 0 4px #1a120c,inset 0 0 0 5px #8a6a3566,0 6px 18px #0008}
.sheet{color:var(--ink);padding:26px 22px;border:1px solid var(--line);margin:8px 0 12px;background:radial-gradient(ellipse at 20% 0,#f3e8c6,#e8d9b0 60%,#d6c18d);box-shadow:0 0 0 5px #2b2018,0 0 0 6px var(--line),0 10px 30px #000c}
.sheet h2{color:var(--rubric);text-align:center}
.sheet .sub{color:#6a5430}
.sheet label{display:block;font-size:.85rem;font-weight:700;margin-top:10px}
.sheet input{width:100%;margin-top:4px;padding:12px;background:#f6ecce;color:var(--ink);border:1px solid var(--line);font-size:1rem}
.btn{background:linear-gradient(180deg,#f0d37a,#b8872f);color:#2a1a08;border:1px solid #f0d37a;padding:12px 22px;font-weight:700;letter-spacing:.1em;cursor:pointer}
.btn.dark{background:#3a2c20;color:var(--tx);border-color:var(--line)}
.btn.wide{width:100%}
.err{color:var(--rubric);font-size:.85rem;min-height:1.3em;margin-top:6px}
/* toast / connection */
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.t{background:#000d;border:1px solid var(--acc);padding:8px 16px;border-radius:20px;font-size:.9rem;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#conn{position:fixed;left:0;right:0;top:0;z-index:40;background:#a8262f;text-align:center;padding:4px;font-size:.85rem}
/* lobby */
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.job{background:#1f1710;border:1px solid var(--line);padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center}
.job.sel{background:#4a3519;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.job .e{font-size:1.5rem}.job b{display:block;font-size:.9rem}.job small{color:var(--mut)}
#jobDesc{min-height:2.6em;color:var(--mut);font-size:.85rem;margin-bottom:8px}
.seg{display:flex;margin:6px 0 12px}
.seg button{flex:1;padding:10px;background:#1f1710;border:1px solid var(--line)}
.seg button.sel{background:var(--acc);color:#2a1a08;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);padding:2px 10px;font-size:.85rem;background:#0004}
.chip.off{opacity:.45}
/* game */
#game{display:flex;flex-direction:column;min-height:calc(100dvh - 20px)}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double var(--line);padding:2px 2px 8px;margin-bottom:8px}
.qn{font-family:"Cinzel","Shippori Mincho",serif;font-size:1.3rem;font-weight:800;color:var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:4px}.dot.ok{background:#6fcf6f}.dot.slow{background:#e0b650}
.genre{background:#5a2f6a;border:1px solid #c9a0dc;padding:0 12px;font-weight:700;margin-left:8px}
#me{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px}
#me .em{font-size:2rem;width:56px;height:56px;display:grid;place-items:center;border:2px solid var(--acc);border-radius:50%;background:radial-gradient(circle,#4a3822,#1d140c);flex:none}
#me .nm{font-weight:800;font-size:1.05rem}
.bar{height:12px;background:#0009;border:1px solid #000;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(180deg,#8fc06f,#4a7a34);transition:width .5s}
.bar.low i{background:linear-gradient(180deg,#e0b650,#b8872f)}.bar.crit i{background:linear-gradient(180deg,#d6525c,#8c1c24)}
#banner{text-align:center;padding:10px;border:1px solid var(--line);background:#0004;margin-bottom:8px;transition:.2s}
#banner b{font-size:1.2rem;display:block}
#banner.open{background:#5a1218;border-color:#ff8b94;animation:pulse 1s infinite}
#banner.win{background:linear-gradient(180deg,#f0d37a,#b8872f);color:#2a1a08;border-color:#fff3c0}
#banner.other{background:#2d3a52;border-color:#8fb0e0}
@keyframes pulse{50%{box-shadow:0 0 18px #ff5d6c}}
#rank{font-size:.8rem;margin-top:4px;opacity:.9}
#mid{flex:1}
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scroll-snap-type:x proximity}
.c{--s:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);flex:0 0 112px;min-height:140px;padding:8px 8px 32px;font-size:.8rem;clip-path:var(--s);background:linear-gradient(180deg,#f0d37a,#8a6a35);position:relative;scroll-snap-align:start;text-align:center}
.c::before{content:"";position:absolute;inset:3px;clip-path:var(--s);background:linear-gradient(180deg,#43331f,#241a12)}
.c>*{position:relative}
.c.foe{background:linear-gradient(180deg,#e7a0a0,#7d2c34)}.c.foe::before{background:linear-gradient(180deg,#5a1f26,#2b1013)}
.c.me{background:linear-gradient(180deg,#fffbe0,#e0b650)}
.c.dead{filter:grayscale(1) brightness(.7);opacity:.55}
.c .bar{height:8px}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:1.4rem;pointer-events:none;animation:fl 1.1s forwards;z-index:3;text-shadow:0 2px 3px #000}
.float.d{color:#ff7b86}.float.h{color:#8cf0a8}
@keyframes fl{to{transform:translate(-50%,-34px);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0}
#flash.d{background:radial-gradient(circle,#0000 40%,#ff2030aa);animation:fo .5s}
#flash.h{background:radial-gradient(circle,#0000 40%,#40ff80aa);animation:fo .6s}
@keyframes fo{from{opacity:1}to{opacity:0}}
details#logBox{background:linear-gradient(90deg,#cdb988,#e8d9b0 14%,#e8d9b0 86%,#cdb988);color:var(--ink);padding:8px 14px;box-shadow:inset 0 0 30px #8a6a3566;margin-bottom:8px}
details#logBox summary{cursor:pointer;color:var(--rubric);font-weight:800;letter-spacing:.2em;text-align:center}
#log p{margin:6px 0 0;font-size:.8rem;border-bottom:1px dotted #8a6a3577;padding-bottom:3px}
#buzzArea{position:sticky;bottom:0;padding:14px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0000,#17110c 28%)}
#buzz{display:block;margin:0 auto;width:min(66vw,250px);aspect-ratio:1;border-radius:50%;font-size:2rem;font-weight:900;letter-spacing:.1em;border:6px double #8a6a35;
  background:radial-gradient(circle at 35% 30%,#555,#2a2a2a);color:#999;touch-action:manipulation;transition:transform .05s}
#buzz.on{background:radial-gradient(circle at 35% 30%,#e0505a,#8c1c24 70%,#5a0f15);color:#ffe9b0;border-color:var(--acc);text-shadow:0 2px 0 #000a;box-shadow:0 0 36px #a8262fcc,inset 0 0 20px #0009}
#buzz.on:active,#buzz.sent{transform:scale(.94)}
#buzz.sent{background:radial-gradient(circle at 35% 30%,#8fc06f,#3f6a2c);color:#fff;border-color:#c8e8b0}
#tools{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:20}
#tools button{width:36px;height:36px;border-radius:50%;background:#000a;border:1px solid var(--line);font-size:1rem;line-height:1;padding:0}
#over{position:fixed;inset:0;background:#000d;z-index:35;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center}
#over.on{display:flex}#over h2{font-size:2.6rem}
</style>
</head>
<body>
<div id="conn" class="hide">接続が切れました。再接続しています…</div>
<div id="toast"></div>
<div id="flash"></div>

<div class="wrap">
  <!-- 入室 -->
  <div id="join" class="sheet">
    <h2>部屋に参加</h2>
    <div class="sub" id="roomLabel" style="text-align:center">読み込み中…</div>
    <label>あなたの名前</label><input id="name" maxlength="12" autocomplete="nickname" enterkeyhint="go">
    <label>ひとこと（任意）</label><input id="flavor" maxlength="20" placeholder="例：本日の意気込み">
    <div id="pwBox" class="hide"><label>パスワード</label><input id="pw" maxlength="20" type="password" autocomplete="off"></div>
    <div class="err" id="err"></div>
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px">
      <a href="/" style="color:var(--rubric)">← 一覧に戻る</a>
      <button class="btn" id="joinBtn">参加する</button>
    </div>
  </div>

  <!-- ロビー -->
  <div id="lobby" class="panel hide">
    <h2 id="roomName"></h2>
    <div class="sub" id="who"></div>
    <div class="chips" id="members"></div>
    <div class="sub" style="margin-top:10px">職業を選んでください</div>
    <div class="jobs" id="jobs"></div>
    <div id="jobDesc"></div>
    <div class="sub">チーム（ユーザー対戦のとき）</div>
    <div class="seg" id="team"><button data-t="p">チームA</button><button data-t="e">チームB</button></div>
    <p class="sub">進行役がバトルを開始するとこの画面が切り替わります。</p>
    <div style="display:flex;gap:10px"><button class="btn dark" id="renameBtn" style="flex:1">名前を変える</button><button class="btn dark" id="leaveBtn" style="flex:1">退室する</button></div>
  </div>

  <!-- ゲーム -->
  <div id="game" class="hide">
    <div class="top"><div><span class="qn" id="q"></span><span class="genre hide" id="genre"></span></div><div class="sub"><span class="dot" id="dot"></span><span id="ping"></span></div></div>
    <div id="me" class="panel"></div>
    <div id="banner"><b id="bt"></b><div id="rank"></div></div>
    <div id="mid">
      <div class="strip" id="cards"></div>
      <details id="logBox"><summary>年代記</summary><div id="log"></div></details>
    </div>
    <div id="buzzArea"><button id="buzz" disabled>待機中</button></div>
  </div>
</div>
<div id="tools" class="hide"><button id="sndBtn" aria-label="音">🔊</button></div>
<div id="over"><h2 id="overT"></h2><div class="sub" id="overS"></div></div>

<script>
/* 職業: [名前, 絵文字, ATK, HP, 説明] */
const JOBS={
 sage:['賢者','📿',1,5,'通常攻撃の代わりに、死んだ味方を体力1で蘇生できる'],
 monk:['僧侶','🙏',1,6,'通常攻撃の代わりに、1人を3回復できる'],
 warrior:['戦士','🗡',3,7,'通常攻撃の代わりに、自分と他1人に5ダメージ'],
 mage:['魔法使い','🔮',3,5,'1人に1ダメージを与え、そのプレイヤーは次の問題休み'],
 bm:['バトルマスター','⚔',5,2,'1戦に1度だけ、1人に8ダメージ'],
 tank:['タンク','🛡',1,10,'仲間への攻撃を代わりに受けられる。正解するたびに回数+1'],
 berserker:['バーサーカー','🪓',7,7,'常にボタンにディレイがつく（押しても0.7秒遅れる）'],
 mw:['魔法戦士','✨',2,5,'通常攻撃が常に敵全体への攻撃になる'],
 thief:['盗賊','💰',2,4,'正解したら次の問題のジャンルを選べる'],
 playboy:['遊び人','🎲',0,3,'連続で正解すると「勇者」に転職する'],
 bomb:['ばくだんいわ','💣',1,5,'倒れると両隣に3ダメージを与える'],
 necro:['ネクロマンサー','💀',1,5,'死んだ仲間の人数×1ダメージを与える'],
 hero:['勇者','👑',7,7,'自身を3回復し、他の1人に4ダメージ'],
 boss:['魔王','👹',0,0,'']};
const SEL=['sage','monk','warrior','mage','bm','tank','berserker','mw','thief','playboy','bomb','necro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROOM=new URLSearchParams(location.search).get('id');
const PIDKEY='qr_pid_'+ROOM;
const toList=()=>{location.href='/';};
if(!ROOM)toList();
const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- 通知・音・振動 ---------- */
function toast(msg,ms=2500){const d=document.createElement('div');d.className='t';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms);}
let actx=null,soundOn=store.get('qr_sound')!=='0';
function unlock(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function tone(f,d=.12,type='sine',vol=.15,when=0){
  if(!soundOn||!actx)return;const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}
const SFX={open:()=>tone(660,.18),press:()=>tone(240,.07,'square',.1),
  win:()=>{tone(523,.12,'triangle');tone(659,.12,'triangle',.15,.1);tone(784,.3,'triangle',.15,.2);},
  other:()=>tone(330,.15,'sine',.08),hit:()=>{tone(120,.2,'square',.14);},heal:()=>{tone(784,.1);tone(988,.18,'sine',.12,.08);}};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
function setSound(on){soundOn=on;store.set('qr_sound',on?'1':'0');$('#sndBtn').textContent=on?'🔊':'🔇';}
$('#sndBtn').onclick=()=>{unlock();setSound(!soundOn);};setSound(soundOn);
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state)keepAwake();});

/* ---------- 状態 ---------- */
let ws,pid=null,offset=0,bestRtt=1e9,open=false,eligible=[],sent=false,state=null,winner=null,leaving=false,prevHp={},myJob='warrior',myTeam='p',retry=0;
const now=()=>Date.now()+offset;
const send=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));};
const show=id=>{for(const x of ['#join','#lobby','#game'])$(x).classList.toggle('hide',x!==id);$('#tools').classList.toggle('hide',id!=='#game'&&id!=='#lobby');};

$('#name').value=store.get('qr_name')||'';
$('#flavor').value=store.get('qr_flavor')||'';

async function init(){
  let info=null;
  try{info=(await (await fetch('/api/rooms',{cache:'no-store'})).json()).find(r=>String(r.id)===ROOM);}catch(e){}
  if(!info||!info.used){toast('その部屋は存在しません');setTimeout(toList,1200);return;}
  $('#roomLabel').textContent=`${info.id}番「${info.name}」`;
  $('#roomName').textContent=info.name;
  $('#pwBox').classList.toggle('hide',!info.hasPw);
  const known=sessionStorage.getItem(PIDKEY);
  // 再接続、または名前が保存済みでパスワード不要なら、入力なしで自動入室
  if(known&&$('#name').value||(!info.hasPw&&$('#name').value&&!location.hash.includes('edit'))){connect();$('#roomLabel').textContent+='　入室中…';}
  else $('#name').focus();
}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?id='+ROOM);
  ws.onopen=()=>{
    retry=0;$('#conn').classList.add('hide');bestRtt=1e9;for(let i=0;i<8;i++)setTimeout(ping,i*120);
    send({t:'join',id:ROOM,name:$('#name').value.trim(),flavor:$('#flavor').value.trim(),password:$('#pw').value,pid:sessionStorage.getItem(PIDKEY)||undefined});
  };
  ws.onclose=()=>{if(leaving)return;$('#conn').classList.remove('hide');$('#dot').className='dot';setTimeout(connect,Math.min(5000,1000+retry++*800));};
  ws.onmessage=ev=>handle(JSON.parse(ev.data));
}
function ping(){send({t:'ping',c:Date.now()});}
setInterval(()=>{bestRtt=1e9;for(let i=0;i<4;i++)setTimeout(ping,i*150);},30000);

function handle(m){
  if(m.t==='pong'){const t1=Date.now(),rtt=t1-m.c;if(rtt<bestRtt){bestRtt=rtt;offset=m.s+rtt/2-t1;$('#ping').textContent=`${Math.round(rtt)}ms`;$('#dot').className='dot '+(rtt<150?'ok':'slow');}}
  else if(m.t==='error'){
    if(m.code==='gone'){sessionStorage.removeItem(PIDKEY);toast(m.msg);leaving=true;setTimeout(toList,1200);}
    else{sessionStorage.removeItem(PIDKEY);pid=null;leaving=true;try{ws.close();}catch(e){}show('#join');$('#err').textContent=m.msg;if(m.code==='pw'){$('#pwBox').classList.remove('hide');$('#pw').focus();}}
  }
  else if(m.t==='joined'){
    pid=m.pid;leaving=false;sessionStorage.setItem(PIDKEY,pid);store.set('qr_name',m.name);store.set('qr_flavor',m.flavor||'');
    myJob=m.job;myTeam=m.team;$('#who').textContent=`${m.name} として参加中`;$('#roomName').textContent=m.roomName;drawLobby();
    show(state?'#game':'#lobby');keepAwake();render();
  }
  else if(m.t==='members'){$('#members').innerHTML=m.players.map(p=>`<span class="chip ${p.online?'':'off'}">${p.online?'●':'○'} ${esc(p.name)}${p.flavor?` 〈${esc(p.flavor)}〉`:''}</span>`).join('');}
  else if(m.t==='state'){const first=!state;state=m.state;show('#game');render();if(first)toast('バトル開始！');}
  else if(m.t==='ended'){state=null;open=false;winner=null;prevHp={};show('#lobby');$('#over').classList.remove('on');}
  else if(m.t==='open'){open=true;eligible=m.eligible;sent=false;winner=null;if(eligible.includes(pid)){SFX.open();vib(30);}render();}
  else if(m.t==='locked'){open=false;render();}
  else if(m.t==='ack'){sent=true;render();}
  else if(m.t==='winner'){open=false;winner=m;
    if(m.pid===pid){SFX.win();vib([120,60,200]);}else SFX.other();render();}
  else if(m.t==='closed'){leaving=true;sessionStorage.removeItem(PIDKEY);toast(m.why||'部屋が閉じられました',3500);setTimeout(toList,2200);}
}

/* ---------- 描画 ---------- */
function drawLobby(){
  $('#jobs').innerHTML=SEL.map(j=>{const d=JOBS[j];return `<button class="job ${j===myJob?'sel':''}" data-j="${j}"><span class="e">${qkIcon(j)}</span><span><b>${d[0]}</b><small>ATK${d[2]} / HP${d[3]}</small></span></button>`;}).join('');
  $('#jobDesc').textContent=(JOBS[myJob]||[])[4]||'';
  for(const b of $('#team').children)b.classList.toggle('sel',b.dataset.t===myTeam);
}
function hpClass(u){const r=u.hp/u.maxHp;return r<=.25?'crit':r<=.5?'low':'';}
function render(){
  if(!state)return;
  const mine=state.pids&&state.pids[pid];
  const me=state.units.find(u=>u.id===mine);
  $('#q').textContent=`第${state.q}問`;
  const g=$('#genre');g.textContent=state.genre||'';g.classList.toggle('hide',!state.genre);
  // 自分の状態
  if(me){
    const d=JOBS[me.job]||JOBS.boss;
    $('#me').innerHTML=`<div class="em">${qkIcon(JOBS[me.job]?me.job:'boss')}</div><div style="flex:1"><div class="nm">${esc(me.name)} <span class="sub">${esc(me.jobName||'')}</span></div>
      <div class="bar ${hpClass(me)}"><i style="width:${Math.max(0,me.hp/me.maxHp*100)}%"></i></div>
      <div>HP <b>${Math.max(0,me.hp)}</b> / ${me.maxHp}${me.restNow?'　💤今回は休み':''}${me.job==='tank'?`　🛡守り×${me.guards}`:''}${me.alive?'':'　💀戦闘不能'}</div></div>`;
  }else $('#me').innerHTML='<div class="sub">観戦中（進行役が席に割り当てるとプレイヤーになります）</div>';
  // ボタンとバナー
  const can=open&&eligible.includes(pid)&&!sent&&!state.over;
  const b=$('#buzz');
  b.disabled=!can;b.className=can?'on':(sent?'sent':'');
  b.textContent=can?'押す！':sent?'送信済み':(me&&!me.alive)?'戦闘不能':(me&&me.restNow)?'今回は休み':open?'待機中':'待機中';
  const bn=$('#banner'),bt=$('#bt'),rk=$('#rank');let cls='',txt='',rank='';
  if(state.over)txt='バトル終了';
  else if(winner&&winner.q===state.q){
    if(winner.pid===pid){cls='win';txt='🎉 回答権を獲得！答えてください';}else{cls='other';txt=`回答権：${winner.name}`;}
    rank=winner.ranking.slice(0,4).map((x,i)=>`${i+1}. ${esc(x.name)}${i?` (+${Math.round(x.ms)}ms)`:''}`).join('　');
  }else if(open&&eligible.includes(pid)){cls='open';txt='受付中！ 押せ！';}
  else if(open)txt='受付中（今回は押せません）';
  else txt='問題を待っています…';
  bn.className=cls;bt.textContent=txt;rk.innerHTML=rank;
  // 全員の盾
  $('#cards').innerHTML=state.units.map(u=>`<div class="c ${u.side==='e'?'foe':''} ${u.id===mine?'me':''} ${u.alive?'':'dead'}" data-id="${u.id}">
    <div style="font-size:1.6rem">${qkIcon(JOBS[u.job]?u.job:'boss')}</div><b>${esc(u.name)}</b><div class="sub" style="font-size:.7rem">${esc(u.jobName||'')}</div>
    <div class="bar ${hpClass(u)}"><i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i></div>${Math.max(0,u.hp)}/${u.maxHp}${u.restNow?' 💤':''}${u.job==='tank'?' 🛡'+u.guards:''}</div>`).join('');
  $('#log').innerHTML=(state.log||[]).map(l=>`<p>${esc(l)}</p>`).join('');
  // HP増減の演出
  for(const u of state.units){
    const p=prevHp[u.id];
    if(p!==undefined&&p!==u.hp){
      const diff=u.hp-p,el=$(`#cards [data-id="${u.id}"]`);
      if(el){const f=document.createElement('div');f.className='float '+(diff<0?'d':'h');f.textContent=(diff>0?'+':'')+diff;el.appendChild(f);setTimeout(()=>f.remove(),1100);}
      if(u.id===mine){const fl=$('#flash');fl.className='';void fl.offsetWidth;fl.className=diff<0?'d':'h';if(diff<0){SFX.hit();vib(diff<-3?[80,40,120]:60);}else SFX.heal();}
    }
    prevHp[u.id]=u.hp;
  }
  // 決着
  const ov=$('#over');
  if(state.over){
    const T={win:'🎉 勝利！',lose:'💀 全滅…',teamp:'🏆 チームAの勝利！',teame:'🏆 チームBの勝利！',draw:'引き分け'};
    $('#overT').textContent=T[state.over]||'バトル終了';$('#overS').textContent='進行役の操作を待っています';ov.classList.add('on');
  }else ov.classList.remove('on');
}

/* ---------- 操作 ---------- */
function buzz(){
  if($('#buzz').disabled)return;
  unlock();SFX.press();vib(25);
  send({t:'buzz',ts:now()});
  // 通信を待たずに押した感触を返す
  sent=true;$('#buzz').className='sent';$('#buzz').textContent='送信中…';
}
$('#buzz').addEventListener('pointerdown',e=>{e.preventDefault();buzz();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&state){e.preventDefault();buzz();}});
document.addEventListener('pointerdown',unlock,{once:true});
$('#joinBtn').onclick=()=>{
  if(!$('#name').value.trim()){$('#err').textContent='名前を入力してください';$('#name').focus();return;}
  unlock();$('#err').textContent='';sessionStorage.removeItem(PIDKEY);leaving=false;connect();
};
$('#join').addEventListener('keydown',e=>{if(e.key==='Enter')$('#joinBtn').click();});
$('#jobs').addEventListener('click',e=>{const b=e.target.closest('.job');if(!b)return;myJob=b.dataset.j;drawLobby();send({t:'profile',job:myJob,team:myTeam});});
$('#team').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;myTeam=b.dataset.t;drawLobby();send({t:'profile',job:myJob,team:myTeam});});
$('#leaveBtn').onclick=()=>{leaving=true;send({t:'leave'});sessionStorage.removeItem(PIDKEY);toList();};
$('#renameBtn').onclick=()=>{leaving=true;send({t:'leave'});sessionStorage.removeItem(PIDKEY);try{ws.close();}catch(e){}pid=null;state=null;show('#join');$('#name').focus();$('#name').select();};
init();
</script>
</body>
</html>
